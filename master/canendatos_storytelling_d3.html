      : d3.format("d");
    svg.append("g").attr("class", "ced-axis").attr("transform", `translate(0,${h - m.bottom})`)
      .call(d3.axisBottom(x).ticks(4).tickFormat(xTickFormat));
    svg.append("g").attr("class", "ced-axis").attr("transform", `translate(${m.left},0)`)
      .call(d3.axisLeft(y).ticks(4).tickFormat(d => d3.format(meta.fmt)(d)));
    // Si el eje no empieza en cero, conviene decirlo junto a qué se mide.
    svg.append("text").attr("x", m.left).attr("y", 13)
      .attr("fill", "var(--ced-muted)").attr("font-size", 11)
      .text(`${meta.short} (${meta.unit})${y.domain()[0] > 0 ? " · el eje no parte de cero" : ""}`);

    // Banda intercuartílica
    svg.append("path").datum(porPeriodo.filter(p => p.q1 != null))
      .attr("fill", "var(--ced-accent)").attr("opacity", .16)
      .attr("d", d3.area().x(p => x(p.periodo)).y0(p => y(p.q1)).y1(p => y(p.q3)));

    // Mediana autonómica
    svg.append("path").datum(porPeriodo.filter(p => p.mediana != null))
      .attr("fill", "none").attr("stroke", "var(--ced-muted)").attr("stroke-width", 1.4)
      .attr("stroke-dasharray", "5 4")
      .attr("d", d3.line().x(p => x(p.periodo)).y(p => y(p.mediana)));

    const linea = d3.line().defined(d => d[state.metric] != null)
      .x(d => x(d.periodo)).y(d => y(d[state.metric]));

    // Canarias, siempre. Si hay otra elegida, va en el color de acento.
    if (canarias) {
      svg.append("path").datum(canarias.values)
        .attr("fill", "none").attr("stroke", "var(--ced-contrast)")
        .attr("stroke-width", 2.8).attr("d", linea);
    }
    if (elegida && elegida !== canarias) {
      svg.append("path").datum(elegida.values)
        .attr("fill", "none").attr("stroke", "var(--ced-accent-deep)")
        .attr("stroke-width", 2.4).attr("d", linea);
    }

    /* Rótulo con halo: el texto se pinta dos veces, primero engordado en
       blanco y luego encima en su color. Sin eso, sobre la banda o sobre
       una línea no hay quien lo lea. */
    function rotula(capa, px, py, texto, color, tam, ancla) {
      return [true, false].map(halo => {
        const t = capa.append("text")
          .attr("x", px).attr("y", py).attr("dy", "0.35em")
          .attr("text-anchor", ancla || "middle")
          .attr("font-size", tam).attr("font-weight", 700)
          .text(texto);
        if (halo) t.attr("stroke", "var(--ced-surface)").attr("stroke-width", 3.5)
                   .attr("stroke-linejoin", "round").attr("fill", "none");
        else t.attr("fill", color);
        return t.node();
      });
    }

    const capaRotulos = svg.append("g");

    /* Nombre de cada serie dibujada, al final de su trazo. La serie
       resaltada lleva ahí mismo su última etiqueta de dato, así que su
       nombre sube un piso más para no pisarla; y si al subir se sale por
       arriba, baja al otro lado de la línea. */
    function nombraFinal(serie, color) {
      const vals = serie.values.filter(v => v[state.metric] != null);
      if (!vals.length) return;
      const ult = vals[vals.length - 1];
      const salto = serie === resaltada ? 30 : 12;
      const alto = y(ult[state.metric]) - salto;
      return rotula(capaRotulos, x(ult.periodo), alto < m.top + 10 ? y(ult[state.metric]) + salto : alto,
                    serie.ccaa, color, 11.5, "end");
    }
    const rotulosSerie = [];
    if (canarias) rotulosSerie.push(nombraFinal(canarias, "var(--ced-contrast)"));
    if (elegida && elegida !== canarias) rotulosSerie.push(nombraFinal(elegida, "var(--ced-accent-deep)"));
    const ultMed = porPeriodo.filter(p => p.mediana != null).slice(-1)[0];
    if (ultMed) rotulosSerie.push(rotula(capaRotulos, x(ultMed.periodo), y(ultMed.mediana) + 13, "Mediana CCAA", "var(--ced-muted)", 10.5, "end"));
    // Cajas de los rótulos ya puestos, para que las etiquetas de datos no los pisen.
    const colocadas = rotulosSerie.filter(Boolean).map(nodos => nodos[1].getBBox());

    /* Etiquetas de datos a lo largo de la línea resaltada. No en todos los
       puntos: en una serie mensual son cientos y se solapan. Se reparten
       seis a lo largo y siempre entran el primero y el último, que son los
       que se buscan. */
    if (resaltada) {
      const vals = resaltada.values.filter(v => v[state.metric] != null);
      const cuantas = Math.min(6, vals.length);
      const idx = new Set([0, vals.length - 1]);
      for (let i = 1; i < cuantas - 1; i++) idx.add(Math.round(i * (vals.length - 1) / (cuantas - 1)));
      const color = resaltada === canarias ? "var(--ced-contrast)" : "var(--ced-accent-deep)";
      const orden = Array.from(idx).sort((a, b) => a - b);
      orden.forEach(i => {
        const d = vals[i];
        svg.append("circle").attr("cx", x(d.periodo)).attr("cy", y(d[state.metric])).attr("r", 3)
          .attr("fill", d.origen === "proyeccion" ? "var(--ced-surface)" : color)
          .attr("stroke", color).attr("stroke-width", 1.6);
      });
      /* Las etiquetas se colocan después de los puntos. El último y el
         primero van siempre, que son los que se buscan; los intermedios, sólo
         si no pisan otra etiqueta ni el nombre de una serie. Cuando la serie
         se queda plana —una proyección que repite valor— dos etiquetas caían
         a la misma altura y se leía «10,05 /1(10,05 /100k». El punto sigue
         marcado igual. */
      const choca = b => colocadas.some(c =>
        b.x < c.x + c.width + 4 && c.x < b.x + b.width + 4 &&
        b.y < c.y + c.height && c.y < b.y + b.height);
      const extremos = new Set([orden[0], orden[orden.length - 1]]);
      Array.from(new Set([...extremos, ...orden])).forEach(i => {
        const d = vals[i];
        const nodos = rotula(capaRotulos, x(d.periodo), y(d[state.metric]) - 13,
               fmtVal(state.metric, d[state.metric]), color, 10.5,
               i === 0 ? "start" : (i === vals.length - 1 ? "end" : "middle"));
        const caja = nodos[1].getBBox();
        if (!extremos.has(i) && choca(caja)) nodos.forEach(n => n.remove());
        else colocadas.push(caja);
      });
    }

    // Selector de comunidad: en táctil no hay hover con el que aislar una
    // línea, así que se elige explícitamente.
    const pie = d3.select(wrap).append("div").attr("class", "ced-legend");
    const nombres = series.map(s => s.ccaa).sort(d3.ascending);
    pie.html(`
      <label style="display:flex;align-items:center;gap:8px;width:100%">
        <span style="color:var(--ced-muted);white-space:nowrap">Resaltar</span>
        <select data-ced-evo style="flex:1;min-height:44px;font-size:16px">
          ${nombres.map(n => `<option value="${n}"${n === evoSeleccion ? " selected" : ""}>${n}</option>`).join("")}
        </select>
      </label>
      <span><span class="ced-legend-swatch" style="background:var(--ced-accent);opacity:.3"></span>Mitad central de las CCAA (p25-p75)</span>
      <span><span class="ced-legend-swatch" style="background:var(--ced-muted)"></span>Mediana (--)</span>
    `);
    pie.select("[data-ced-evo]").on("change", function () {
      evoSeleccion = this.value;
      renderEvolution();
    });
  }

  function renderEvolution() {
    const cfg = SECTIONS[state.section];
    const meta = cfg.metrics[state.metric];
    const wrap = els.chart; wrap.innerHTML = "";
    const mobile = isMobile();
    const w = wrap.clientWidth || 720;
    const h = mobile ? 360 : 460;
    const m = mobile ? { top:20, right:14, bottom:36, left:42 } : { top:24, right:150, bottom:42, left:58 };
    const all = rowsForView().filter(r => r[state.metric] != null && r.ccaa !== "Media Estatal");
    if (all.length === 0) { wrap.innerHTML = `<div class="ced-loading">No hay datos para este indicador.</div>`; return; }
    const series = Array.from(d3.group(all, r => r.ccaa), ([ccaa, vals]) => ({
      ccaa, values: vals.slice().sort((a,b) => a.periodo - b.periodo)
    }));
    const stateLine = stateSeries(state.metric, state.gender);

    // En vertical la maraña de diecisiete series no se lee: se cuenta con
    // banda intercuartílica, mediana y las líneas que se resalten.
    if (mobile) { renderEvolutionMobile(wrap, cfg, meta, series, stateLine); return; }

    const svg = d3.select(wrap).append("svg").attr("viewBox", `0 0 ${w} ${h}`);
    const x = d3.scaleLinear().domain(d3.extent(all, r => r.periodo)).range([m.left, w - m.right]);
    // Eje Y: desde cero por defecto. Con evolutionAxis "adaptive" se ajusta al
    // recorrido de la variable, como ya hace la vista móvil: en series que se
    // mueven en una banda estrecha —un 8-12 % de población, un precio que va
    // de 1.500 a 3.000 €/m²— el cero se come la mitad del alto del gráfico.
    // Entran en el dominio también los valores de la media estatal.
    const adaptive = cfg.evolutionAxis === "adaptive";
    const yDomain = adaptive
      ? adaptiveDomain(all.map(r => r[state.metric]).concat(stateLine.map(d => d.value)), 0.04)
      : [0, d3.max(all, r => r[state.metric])];
    // Sin .nice() en el eje adaptativo: redondea hacia fuera al paso de los
    // ticks y devolvía el espacio que se quería ganar. Con diecisiete series
    // el suelo volvía a cero (precio de venta: 644 frente a 6.157 €/m²) y el
    // techo subía de más (antidepresivos: 178 DHD a un eje de 200). Los ticks
    // siguen cayendo en valores redondos dentro del dominio.
    const y = d3.scaleLinear().domain(yDomain).range([h - m.bottom, m.top]);
    if (!adaptive) y.nice();
    const line = d3.line().defined(d => d[state.metric] != null).x(d => x(d.periodo)).y(d => y(d[state.metric]));
    const stateLineGen = d3.line().x(d => x(d.periodo)).y(d => y(d.value));

    svg.append("g").attr("class","ced-grid").attr("transform", `translate(${m.left},0)`)
      .call(d3.axisLeft(y).ticks(5).tickSize(-(w - m.left - m.right)).tickFormat(""))
      .call(g => g.select(".domain").remove());
    // Eje X: para anuales, ticks enteros (años). Para mensuales, ticks por
    // anio entero pero etiqueta abreviada de mes en posiciones intermedias
    // si caben (auto-ajustado por d3 con ticks(...)).
    const xTickFormat = cfg.granularity === "monthly"
      ? (v => {
          const yr = Math.floor(v);
          const mo = Math.round((v - yr) * 12) + 1;
          if (mo === 1) return String(yr);
          return MONTH_NAMES_ES_SHORT[mo - 1];
        })
      : d3.format("d");
    svg.append("g").attr("class","ced-axis").attr("transform", `translate(0,${h-m.bottom})`)
      .call(d3.axisBottom(x).ticks(cfg.granularity === "monthly" ? 10 : 8).tickFormat(xTickFormat));
    svg.append("g").attr("class","ced-axis").attr("transform", `translate(${m.left},0)`)
      .call(d3.axisLeft(y).ticks(5).tickFormat(d => d3.format(meta.fmt)(d)));
    svg.append("text").attr("x", m.left).attr("y", 14)
      .attr("fill","var(--ced-muted)").attr("font-size", 12)
      .text(`${meta.short} (${meta.unit})${y.domain()[0] > 0 ? " · el eje no parte de cero" : ""}`);

    const stateLayer = svg.append("g");
    const lineLayer  = svg.append("g");
    const labelLayer = svg.append("g");
    const hitLayer   = svg.append("g");

    if (stateLine.length > 1) {
      stateLayer.append("path").datum(stateLine)
        .attr("fill","none").attr("stroke","var(--ced-ink)").attr("stroke-width", 1.6)
        .attr("stroke-dasharray","4 3").attr("d", stateLineGen);
    }

    const paths = lineLayer.selectAll("path.ced-series").data(series).join("path")
      .attr("class","ced-series").attr("d", d => line(d.values))
      .attr("fill","none")
      .attr("stroke", d => d.ccaa === "Canarias" ? "var(--ced-contrast)" : "var(--ced-accent)")
      .attr("stroke-width", d => d.ccaa === "Canarias" ? 3 : 1.4)
      .attr("opacity", d => d.ccaa === "Canarias" ? 1 : 0.4);

    function highlight(name, event) {
      paths.attr("opacity", d => d.ccaa === name ? 1 : 0.1)
        .attr("stroke-width", d => d.ccaa === name ? 3.6 : 1)
        .attr("stroke", d => d.ccaa === name ? "var(--ced-contrast)" : "var(--ced-line)");
      labelLayer.selectAll("*").remove();
      const sel = series.find(d => d.ccaa === name);
      if (!sel) return;
      const last = sel.values[sel.values.length - 1];
      labelLayer.append("text").attr("x", x(last.periodo) + 8).attr("y", y(last[state.metric]))
        .attr("dy","0.35em").attr("text-anchor","start")
        .attr("fill","var(--ced-contrast)").attr("font-size", 13).attr("font-weight", 800).text(name);
      sel.values.forEach(d => {
        labelLayer.append("circle").attr("cx", x(d.periodo)).attr("cy", y(d[state.metric])).attr("r", 4)
          .attr("fill", d.origen === "proyeccion" ? "#fff" : "var(--ced-contrast)")
          .attr("stroke", "var(--ced-contrast)").attr("stroke-width", 1.6);
      });
      const svgEl = wrap.querySelector("svg");
      const [mx] = d3.pointer(event, svgEl);
      const nearest = d3.least(sel.values, d => Math.abs(x(d.periodo) - mx)) || last;
      const extra = meta.extra ? meta.extra(nearest) : null;
      const nearestLabel = formatPeriodLabel(nearest.period, cfg.granularity, { long: cfg.granularity === "monthly" });
      showTip(`
        <strong>${name} · ${nearestLabel}</strong>
        <span class="ced-tooltip-metric">${meta.short} (${nearest.origen === "proyeccion" ? "proyección" : "real"})</span>
        <span class="ced-tooltip-value">${fmtVal(state.metric, nearest[state.metric])}</span>
        ${extra ? `<span class="ced-tooltip-extra">${extra}</span>` : ""}
      `, event);
    }
    function reset() {
      paths.attr("opacity", d => d.ccaa === "Canarias" ? 1 : 0.4)
        .attr("stroke-width", d => d.ccaa === "Canarias" ? 3 : 1.4)
        .attr("stroke", d => d.ccaa === "Canarias" ? "var(--ced-contrast)" : "var(--ced-accent)");
      labelLayer.selectAll("*").remove();
      const can = series.find(d => d.ccaa === "Canarias");
      if (can && !mobile) {
        const last = can.values[can.values.length - 1];
        labelLayer.append("text").attr("x", x(last.periodo)+8).attr("y", y(last[state.metric]))
          .attr("dy","0.35em").attr("fill","var(--ced-contrast)").attr("font-size", 13).attr("font-weight", 800)
          .text("Canarias");
      }
      hideTip();
    }
    hitLayer.selectAll("path.ced-line-hit").data(series).join("path")
      .attr("d", d => line(d.values)).attr("fill","none")
      .attr("stroke","transparent").attr("stroke-width", 14).style("cursor","pointer")
      .on("mousemove", (event, d) => highlight(d.ccaa, event))
      .on("mouseleave", reset);
    reset();

    const lg = d3.select(wrap).append("div").attr("class","ced-legend");
    lg.html(`
      <span><span class="ced-legend-swatch" style="background:var(--ced-contrast)"></span>Canarias</span>
      <span><span class="ced-legend-swatch" style="background:var(--ced-ink)"></span>Media estatal (--)</span>
      <span><span class="ced-legend-swatch" style="background:var(--ced-accent);opacity:.4"></span>Otras CCAA</span>
      <span style="color:var(--ced-muted)">Pasa el ratón por una línea para aislarla</span>
    `);
  }

  // ====== Render: brecha de género (dumbbell) ==============================
  function renderGender() {
    const cfg = SECTIONS[state.section];
    if (!cfg.hasGender) { els.chart.innerHTML = `<div class="ced-loading">Esta sección no expone desagregación por género.</div>`; return; }
    const meta = cfg.metrics[state.metric];
    const yr = formatPeriodLabel(state.period, cfg.granularity, { long: cfg.granularity === "monthly" });
    const wrap = els.chart; wrap.innerHTML = "";
    // Variante móvil: tarjetas apiladas con barras hombres/mujeres
    // Indicador que la sección declara sin desagregar: se explica, no se pinta.
    if (genderNoteFor(state.metric) === "No desagregado") { wrap.innerHTML = genderEmptyHtml(meta, yr); return; }
    if (isMobile()) { renderMobileGender(wrap); return; }
    const cache = state.cache[state.section];
    const all = (cache && cache.rows ? cache.rows : []).filter(r => r.period === state.period && r.ccaa !== "Media Estatal" && r[state.metric] != null);
    const byCcaa = d3.group(all, r => r.ccaa);
    const rows = Array.from(byCcaa, ([ccaa, vs]) => {
      const h = vs.find(r => r.genero === "hombres");
      const m = vs.find(r => r.genero === "mujeres");
      if (!h || !m) return null;
      return { ccaa, men:h[state.metric], women:m[state.metric], gap:m[state.metric] - h[state.metric] };
    }).filter(Boolean).sort((a,b) => d3.descending(Math.abs(a.gap), Math.abs(b.gap)));

    if (rows.length === 0) {
      wrap.innerHTML = genderEmptyHtml(meta, yr);
      return;
    }
    const w = wrap.clientWidth || 720;
    const h = Math.max(460, rows.length*30 + 80);
    const mg = { top:38, right:118, bottom:42, left:170 };
    const svg = d3.select(wrap).append("svg").attr("viewBox", `0 0 ${w} ${h}`);
    const ext = d3.extent(rows.flatMap(r => [r.men, r.women]));
    const x = d3.scaleLinear().domain(ext).nice().range([mg.left, w - mg.right]);
    const y = d3.scaleBand().domain(rows.map(r => r.ccaa)).range([mg.top, h - mg.bottom]).padding(0.36);

    svg.append("g").attr("class","ced-grid").attr("transform", `translate(0,${h - mg.bottom})`)
      .call(d3.axisBottom(x).ticks(5).tickSize(-(h - mg.top - mg.bottom)).tickFormat(""))
      .call(g => g.select(".domain").remove());
    svg.append("g").attr("class","ced-axis").attr("transform", `translate(0,${h-mg.bottom})`).call(d3.axisBottom(x).ticks(5));
    svg.append("g").attr("class","ced-axis").attr("transform", `translate(${mg.left},0)`)
      .call(d3.axisLeft(y).tickSize(0)).call(g => g.select(".domain").remove());

    const rowGroups = svg.append("g").selectAll("g.ced-gender-row").data(rows).join("g")
      .attr("class","ced-gender-row").attr("cursor","pointer");

    rowGroups.append("line")
      .attr("x1", r => x(r.men)).attr("x2", r => x(r.women))
      .attr("y1", r => y(r.ccaa) + y.bandwidth()/2).attr("y2", r => y(r.ccaa) + y.bandwidth()/2)
      .attr("stroke", r => r.ccaa === "Canarias" ? "var(--ced-ink)" : "var(--ced-line)")
      .attr("stroke-width", r => r.ccaa === "Canarias" ? 2.6 : 1.7);
    rowGroups.append("circle").attr("class","ced-men-dot")
      .attr("cx", r => x(r.men)).attr("cy", r => y(r.ccaa) + y.bandwidth()/2)
      .attr("r", r => r.ccaa === "Canarias" ? 5.5 : 4.2)
      .attr("fill","var(--ced-men)");
    rowGroups.append("circle").attr("class","ced-women-dot")
      .attr("cx", r => x(r.women)).attr("cy", r => y(r.ccaa) + y.bandwidth()/2)
      .attr("r", r => r.ccaa === "Canarias" ? 5.5 : 4.2)
      .attr("fill","var(--ced-women)");
    rowGroups.append("text")
      .attr("x", w - mg.right + 12).attr("y", r => y(r.ccaa) + y.bandwidth()/2).attr("dy","0.35em")
      .attr("fill", r => r.ccaa === "Canarias" ? "var(--ced-accent-deep)" : "var(--ced-muted)")
      .attr("font-weight", r => r.ccaa === "Canarias" ? 800 : 500).attr("font-size", 12)
      .text(r => `${r.gap >= 0 ? "+" : ""}${d3.format(meta.fmt)(r.gap)}${meta.suffix}`);
    rowGroups.append("rect")
      .attr("x", mg.left).attr("y", r => y(r.ccaa) - 4)
      .attr("width", w - mg.left - mg.right + 100).attr("height", y.bandwidth() + 8)
      .attr("fill","transparent")
      .on("mousemove", function(evt, d) {
        rowGroups.attr("opacity", r => r.ccaa === d.ccaa ? 1 : 0.22);
        const g = d3.select(this.parentNode); g.raise();
        showTip(`
          <strong>${d.ccaa}</strong>
          <span class="ced-tooltip-metric">${meta.short} · ${yr}</span>
          <span class="ced-tooltip-value">Brecha ${d.gap >= 0 ? "+" : ""}${d3.format(meta.fmt)(d.gap)}${meta.suffix}</span>
          <span class="ced-tooltip-extra">Mujeres: ${fmtVal(state.metric, d.women)}</span>
          <span class="ced-tooltip-extra">Hombres: ${fmtVal(state.metric, d.men)}</span>
        `, evt);
      })
      .on("mouseleave", function() {
        rowGroups.attr("opacity", 1); hideTip();
      });

    svg.append("circle").attr("cx", mg.left).attr("cy", 18).attr("r", 4).attr("fill","var(--ced-men)");
    svg.append("text").attr("x", mg.left + 9).attr("y", 22).attr("font-size", 12).attr("fill","var(--ced-muted)").text("Hombres");
    svg.append("circle").attr("cx", mg.left + 90).attr("cy", 18).attr("r", 4).attr("fill","var(--ced-women)");
    svg.append("text").attr("x", mg.left + 99).attr("y", 22).attr("font-size", 12).attr("fill","var(--ced-muted)").text("Mujeres");
    if (meta.sexo === "estimado") {
      svg.append("text").attr("x", w - mg.right + 100).attr("y", 22).attr("text-anchor","end")
        .attr("font-size", 12).attr("fill","var(--ced-muted)")
        .text(`Estimación: ${cfg.genderEstimateNote || "no es un dato publicado"}`);
    }
  }

  // ====== Render: metodología =============================================
  function renderMethod() {
    els.chart.innerHTML = "";
    els.methodGrid.hidden = false;
  }

  // ====== Render principal ================================================
  function render() {
    const cfg = SECTIONS[state.section];
    const meta = cfg.metrics[state.metric];
    // Con desagregación estimada, el subtítulo lo avisa en cuanto se mira por sexo.
    const estimado = meta.sexo === "estimado";
    const generoTxt = state.gender + (estimado && state.gender !== "total" ? " (estimación)" : "");
    // En secciones mensuales la clave del periodo es «2026-11»; al público se
    // le enseña «noviembre 2026». En las anuales no cambia nada.
    const periodoTxt = formatPeriodLabel(state.period, cfg.granularity, { long: cfg.granularity === "monthly" });
    const titles = {
      context:  { t:"Situar Canarias",   s:`Mapa coroplético · ${meta.label} · ${periodoTxt} · género: ${generoTxt}` },
      evolution:{ t:"Evolución",         s:`Serie temporal de ${meta.label} · género: ${generoTxt}` },
      gender:   { t:"Brecha de género",  s:`${meta.label} por CCAA · ${periodoTxt} (hombres vs mujeres)${estimado ? ` · estimación: ${cfg.genderEstimateNote || "no es un dato publicado"}` : ""}` },
      method:   { t:"Cómo se construye", s:"Pipeline ETL del Observatorio · R + D3" }
    };
    els.title.textContent = titles[state.step].t;
    els.sub.textContent   = titles[state.step].s;
    const cache = state.cache[state.section];
    const srcBadge = cache && cache.error ? "Error" : "Datos en vivo";
    els.badge.textContent = state.step === "method" ? "Documentación" : (state.period ? `${cfg.label} · ${periodoTxt} · ${srcBadge}` : cfg.label);
    const isMethod = state.step === "method";
    els.methodGrid.hidden = !isMethod;
    // En metodología: ocultar el chart-wrap entero (vacío crearía un hueco) y los KPIs.
    els.chart.style.display = isMethod ? "none" : "";
    els.kpis.style.display  = isMethod ? "none" : "";

    // refrescar value de selectores en caso de cambio externo
    if (els.metricSel.value !== state.metric) els.metricSel.value = state.metric;
    if (state.period != null && els.yearSel.value !== String(state.period)) els.yearSel.value = state.period;
    if (els.genderSel.value !== state.gender) els.genderSel.value = state.gender;

    if (isMethod) { renderMethod(); return; }

    // Sin datos para la combinación actual: KPIs vacíos + mensaje en lugar de chart
    if (state.period == null || availablePeriodsFor(state.metric, state.gender).length === 0) {
      els.kpis.innerHTML = ["", "", "", ""].map(() => `
        <div class="ced-kpi"><div class="ced-kpi-label">Sin datos</div>
        <div class="ced-kpi-value">—</div><div class="ced-kpi-note"></div></div>`).join("");
      els.chart.innerHTML = `<div class="ced-loading">No hay datos para <strong>${meta.label}</strong> con el género <strong>${state.gender}</strong> en esta sección.</div>`;
      return;
    }

    renderKpis();
    if (state.step === "context")   renderMap();
    if (state.step === "evolution") renderEvolution();
    if (state.step === "gender")    renderGender();
  }

  // ====== Bootstrap: carga en paralelo ====================================
  renderSectionTabs();
  applySectionTheme(state.section);

  const geoTask = addTask("geo", "Geometría NUTS-2 (Eurostat)");
  const sectionTasks = {};
  Object.values(SECTIONS).forEach(cfg => {
    sectionTasks[cfg.id] = addTask(`section-${cfg.id}`, `Datos · ${cfg.label}`);
  });

  const geoPromise = loadGeo()
    .then(geo => { state.geo = geo; setTask("geo", geo ? "ok" : "err", geo ? `${geo.features.length} regiones` : "no disponible"); })
    .catch(err => { setTask("geo","err", err.message); state.geo = null; });

  const sectionPromises = Object.values(SECTIONS).map(cfg => {
    return cfg.loader(cfg)
      .then(rows => {
        state.cache[cfg.id] = { rows, error:null };
        const years = Array.from(new Set(rows.map(r => r.periodo)));
        setTask(`section-${cfg.id}`, "ok", `${rows.length} filas · ${years.length} años`);
      })
      .catch(err => {
        console.error(`CED ${cfg.id} falló`, err);
        state.cache[cfg.id] = { rows:[], error:err };
        setTask(`section-${cfg.id}`, "err", "sin datos");
      });
  });

  // Failsafe: si por cualquier motivo el bootstrap no termina en 18s, cerramos
  // igualmente para que el usuario al menos vea el chasis en lugar de un overlay
  // colgado. Las tareas con error siguen visibles brevemente.
  const failsafe = setTimeout(() => {
    console.warn("CED bootstrap: failsafe — cerrando overlay tras 18s");
    finishBootstrap();
  }, 18000);

  let bootstrapDone = false;
  function finishBootstrap() {
    if (bootstrapDone) return;
    bootstrapDone = true;
    clearTimeout(failsafe);
    try {
      restoreSectionState(state.section);
      renderShellForSection();
      render();
    } catch (err) {
      console.error("CED bootstrap render falló", err);
      els.chart.innerHTML = `<div class="ced-loading">Error al inicializar: ${err && err.message ? err.message : err}</div>`;
    }
    setTimeout(hideBootstrap, 250);
  }

  Promise.all([geoPromise, ...sectionPromises])
    .then(finishBootstrap)
    .catch(err => { console.error("CED bootstrap promise.all rechazada", err); finishBootstrap(); });

  }); // ensureD3
})();
</script>
</div>

  <style>
    /* ================================================================
       CED · Canarias en Datos · Hub D3 multi-temático
       Cada sección define su paleta vía data-section="<id>".
       ================================================================ */
    #ced-canendatos-d3 {
      /* Tokens neutros compartidos */
      --ced-bg:#f5f7f9; --ced-surface:#fff; --ced-ink:#142019; --ced-muted:#5a6671;
      --ced-line:#dfe5ea; --ced-soft:#eef2f5;
      /* Paleta por sección — overrides abajo */
      --ced-accent:#1769aa; --ced-accent-soft:#e8f2fb; --ced-accent-deep:#0c3f6b;
      --ced-contrast:#e60d76; --ced-contrast-soft:#fce4ef;
      /* Color por sexo en la escena de género. Por defecto, los de la sección;
         una sección puede fijar los suyos en su bloque de paleta. */
      --ced-men:var(--ced-accent); --ced-women:var(--ced-contrast);
      --ced-shadow:0 16px 40px rgba(20,32,25,.08);
      width:100%; max-width:100%; overflow-x:hidden; color:var(--ced-ink);
      font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing:0; background:var(--ced-bg); padding:18px 14px 28px; position:relative;
    }
    #ced-canendatos-d3, #ced-canendatos-d3 * { box-sizing:border-box; }
    #ced-canendatos-d3 button, #ced-canendatos-d3 select { font:inherit; }

    /* Paletas por sección ---------------------------------------------------- */
    #ced-canendatos-d3[data-section="vivienda"] {
      --ced-accent:#1769aa; --ced-accent-soft:#e8f2fb; --ced-accent-deep:#0c3f6b;
      --ced-contrast:#e6792d; --ced-contrast-soft:#fbe7d6;
      /* Hombres en verde apagado; mujeres conserva el naranja de la sección.
         El verde es oscuro a propósito: verde y naranja son la pareja que peor
         se distingue con daltonismo rojo-verde, y a esta luminosidad quedan en
         ΔE 10,2 con protanopía (umbral 8). */
      --ced-men:#3d7a55;
    }
    #ced-canendatos-d3[data-section="saludmental"] {
      --ced-accent:#0a8a4d; --ced-accent-soft:#e8fbf0; --ced-accent-deep:#074d2a;
      --ced-contrast:#e60d76; --ced-contrast-soft:#fce4ef;
    }
    #ced-canendatos-d3[data-section="dependencia"] {
      --ced-accent:#c4571f; --ced-accent-soft:#fbe8e0; --ced-accent-deep:#6e1f1a;
      --ced-contrast:#168a81; --ced-contrast-soft:#d8edec;
    }
    #ced-canendatos-d3[data-section="educacion"] {
      --ced-accent:#7c3aed; --ced-accent-soft:#f3eefe; --ced-accent-deep:#4c1d95;
      --ced-contrast:#009e8e; --ced-contrast-soft:#e0faf7;
    }
    #ced-canendatos-d3[data-section="sanidad"] {
      --ced-accent:#0d9488; --ced-accent-soft:#d8f3ee; --ced-accent-deep:#115e59;
      --ced-contrast:#e07000; --ced-contrast-soft:#ffe4cc;
    }
    #ced-canendatos-d3[data-section="empleo"] {
      --ced-accent:#dc2626; --ced-accent-soft:#fdeaea; --ced-accent-deep:#7f1d1d;
      --ced-contrast:#0e7490; --ced-contrast-soft:#cff2f7;
    }

    /* Antesala de carga ------------------------------------------------------ */
    #ced-canendatos-d3 .ced-bootstrap {
      position:absolute; inset:0; z-index:50;
      background:linear-gradient(135deg, var(--ced-bg) 0%, #fff 100%);
      display:flex; align-items:center; justify-content:center;
      padding:24px; transition:opacity .35s ease;
    }
    #ced-canendatos-d3 .ced-bootstrap.is-hidden { opacity:0; pointer-events:none; }
    #ced-canendatos-d3 .ced-bootstrap-card {
      background:var(--ced-surface); border:1px solid var(--ced-line); border-radius:12px;
      box-shadow:var(--ced-shadow); padding:28px 30px; max-width:560px; width:100%;
    }
    #ced-canendatos-d3 .ced-bootstrap-eyebrow {
      color:var(--ced-accent); font-size:11.5px; font-weight:700;
      text-transform:uppercase; letter-spacing:.08em; margin-bottom:8px;
    }
    #ced-canendatos-d3 .ced-bootstrap-card h1 {
      margin:0 0 6px; font-size:24px; line-height:1.15; font-weight:760; color:var(--ced-ink);
    }
    #ced-canendatos-d3 .ced-bootstrap-card p {
      margin:0 0 20px; color:var(--ced-muted); font-size:14px; line-height:1.5;
    }
    #ced-canendatos-d3 .ced-bootstrap-tasks {
      display:grid; gap:8px; margin-bottom:16px;
    }
    #ced-canendatos-d3 .ced-bootstrap-task {
      display:flex; align-items:center; gap:10px;
      padding:9px 11px; border:1px solid var(--ced-line); border-radius:7px;
      background:#fbfcfd; font-size:13px; color:var(--ced-ink);
    }
    #ced-canendatos-d3 .ced-bootstrap-dot {
      display:inline-block; width:10px; height:10px; border-radius:999px;
      background:var(--ced-soft); border:1px solid var(--ced-line); flex:none;
      transition:background .2s ease, border-color .2s ease;
    }
    #ced-canendatos-d3 .ced-bootstrap-task[data-state="loading"] .ced-bootstrap-dot {
      background:var(--ced-accent-soft); border-color:var(--ced-accent);
      animation:cedPulse 1.1s ease-in-out infinite;
    }
    #ced-canendatos-d3 .ced-bootstrap-task[data-state="ok"] .ced-bootstrap-dot {
      background:var(--ced-accent); border-color:var(--ced-accent);
    }
    #ced-canendatos-d3 .ced-bootstrap-task[data-state="err"] .ced-bootstrap-dot {
      background:#c0392b; border-color:#c0392b;
    }
    #ced-canendatos-d3 .ced-bootstrap-task small {
      color:var(--ced-muted); font-size:11.5px; margin-left:auto;
    }
    @keyframes cedPulse { 0%,100% { opacity:.4; } 50% { opacity:1; } }
    #ced-canendatos-d3 .ced-bootstrap-bar {
      height:6px; background:var(--ced-soft); border-radius:99px; overflow:hidden;
    }
    #ced-canendatos-d3 .ced-bootstrap-fill {
      height:100%; width:0%; background:var(--ced-accent);
      transition:width .3s ease;
    }

    /* Selector de sección --------------------------------------------------- */
    #ced-canendatos-d3 .ced-sections {
      display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px;
      padding:6px; background:var(--ced-surface); border:1px solid var(--ced-line);
      border-radius:10px; box-shadow:var(--ced-shadow);
    }
    #ced-canendatos-d3 .ced-section-btn {
      flex:1 1 200px; min-width:0; text-align:left; padding:10px 14px;
      background:transparent; border:1px solid transparent; border-radius:7px;
      cursor:pointer; color:var(--ced-ink); display:grid; gap:2px;
    }
    #ced-canendatos-d3 .ced-section-btn:hover { background:var(--ced-soft); }
    #ced-canendatos-d3 .ced-section-btn.is-active {
      background:var(--ced-accent-soft); border-color:var(--ced-accent);
    }
    #ced-canendatos-d3 .ced-section-btn strong {
      font-size:14px; font-weight:700; color:var(--ced-accent-deep);
    }
    #ced-canendatos-d3 .ced-section-btn span {
      font-size:12px; color:var(--ced-muted); line-height:1.3;
    }
    #ced-canendatos-d3 .ced-section-btn[data-coming="true"] {
      cursor:not-allowed; opacity:.55;
    }
    #ced-canendatos-d3 .ced-section-btn[data-coming="true"] strong::after {
      content:" · próximamente"; font-weight:500; font-size:11px; color:var(--ced-muted);
      text-transform:uppercase; letter-spacing:.04em;
    }

    /* Cabecera ---------------------------------------------------------------*/
    #ced-canendatos-d3 .ced-header { background:var(--ced-surface); border:1px solid var(--ced-line); border-radius:10px; overflow:hidden; }
    #ced-canendatos-d3 .ced-header-inner { padding:22px 24px 18px; display:grid; grid-template-columns:minmax(0,1fr) auto; gap:18px; align-items:end; }
    #ced-canendatos-d3 .ced-eyebrow { color:var(--ced-accent); font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; }
    #ced-canendatos-d3 h2 { margin:5px 0 6px; font-size:clamp(26px,3.4vw,44px); line-height:1.06; font-weight:760; color:var(--ced-ink); padding:0; }
    #ced-canendatos-d3 .ced-lead { max-width:790px; color:var(--ced-muted); font-size:15px; line-height:1.55; }
    #ced-canendatos-d3 .ced-actions { display:flex; gap:10px; align-items:center; justify-content:flex-end; flex-wrap:wrap; }
    #ced-canendatos-d3 .ced-btn { border:1px solid var(--ced-line); background:var(--ced-surface); color:var(--ced-ink); min-height:38px; padding:0 14px; border-radius:7px; cursor:pointer; display:inline-flex; align-items:center; gap:8px; white-space:nowrap; font-weight:600; }
    #ced-canendatos-d3 .ced-btn.is-primary { background:var(--ced-accent); border-color:var(--ced-accent); color:#fff; }
    #ced-canendatos-d3 .ced-btn:hover { box-shadow:0 4px 10px rgba(20,32,25,.12); }

    #ced-canendatos-d3 .ced-toolbar { padding:14px 24px; display:flex; gap:14px; flex-wrap:wrap; align-items:center; border-top:1px solid var(--ced-line); }
    #ced-canendatos-d3 .ced-control { display:grid; gap:5px; min-width:0; }
    #ced-canendatos-d3 .ced-control label { color:var(--ced-muted); font-size:11px; font-weight:650; text-transform:uppercase; letter-spacing:.05em; }
    #ced-canendatos-d3 select { min-height:38px; border:1px solid var(--ced-line); border-radius:7px; background:var(--ced-surface); color:var(--ced-ink); padding:0 30px 0 10px; min-width:200px; }

    /* Estructura principal --------------------------------------------------- */
    #ced-canendatos-d3 .ced-main { padding:18px 0 0; display:grid; grid-template-columns:300px minmax(0,1fr); gap:18px; }
    #ced-canendatos-d3 .ced-story-nav { display:grid; gap:10px; align-self:start; position:sticky; top:12px; }
    #ced-canendatos-d3 .ced-story-step { border:1px solid var(--ced-line); border-left:4px solid transparent; background:var(--ced-surface); border-radius:8px; text-align:left; padding:14px; cursor:pointer; color:var(--ced-ink); font-family:inherit; }
    #ced-canendatos-d3 .ced-story-step.is-active { border-left-color:var(--ced-accent); box-shadow:var(--ced-shadow); }
    #ced-canendatos-d3 .ced-story-step strong { display:block; font-size:14px; margin-bottom:4px; }
    #ced-canendatos-d3 .ced-story-step span { display:block; color:var(--ced-muted); font-size:12.5px; line-height:1.45; }
    #ced-canendatos-d3 .ced-stage { min-width:0; display:grid; gap:14px; }
    #ced-canendatos-d3 .ced-kpi-row { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; }
    #ced-canendatos-d3 .ced-kpi { background:var(--ced-surface); border:1px solid var(--ced-line); border-radius:8px; padding:13px 14px; }
    #ced-canendatos-d3 .ced-kpi-label { color:var(--ced-muted); font-size:11px; line-height:1.25; min-height:30px; text-transform:uppercase; letter-spacing:.04em; font-weight:650; }
    #ced-canendatos-d3 .ced-kpi-value { margin-top:8px; font-size:24px; line-height:1; font-weight:760; color:var(--ced-accent-deep); }
    #ced-canendatos-d3 .ced-kpi-note { margin-top:6px; color:var(--ced-muted); font-size:12px; }
    #ced-canendatos-d3 .ced-panel { background:var(--ced-surface); border:1px solid var(--ced-line); border-radius:10px; box-shadow:var(--ced-shadow); overflow:hidden; }
    #ced-canendatos-d3 .ced-panel-head { padding:16px 18px 10px; display:flex; justify-content:space-between; gap:14px; align-items:flex-start; border-bottom:1px solid var(--ced-line); }
    #ced-canendatos-d3 .ced-panel-title { font-size:18px; font-weight:760; margin:0 0 4px; }
    #ced-canendatos-d3 .ced-panel-sub { color:var(--ced-muted); font-size:13px; line-height:1.45; }
    #ced-canendatos-d3 .ced-badge { color:var(--ced-accent-deep); background:var(--ced-accent-soft); border:1px solid var(--ced-accent); border-radius:999px; padding:5px 9px; font-size:11px; font-weight:700; white-space:nowrap; text-transform:uppercase; letter-spacing:.03em; }
    #ced-canendatos-d3 .ced-chart-wrap { min-height:460px; padding:14px 16px 18px; }
    /* Metodología visual --------------------------------------------------- */
    #ced-canendatos-d3 .ced-method-grid { display:flex; flex-direction:column; gap:18px; padding:18px; }
    #ced-canendatos-d3 .ced-method-grid[hidden] { display:none; }
    #ced-canendatos-d3 .ced-method-flow { background:linear-gradient(180deg, var(--ced-accent-soft) 0%, var(--ced-surface) 100%); border:1px solid var(--ced-line); border-radius:10px; padding:14px 16px 16px; }
    #ced-canendatos-d3 .ced-method-flow-title { font-size:11.5px; font-weight:700; color:var(--ced-accent-deep); text-transform:uppercase; letter-spacing:.07em; margin-bottom:12px; display:flex; align-items:center; gap:8px; }
    #ced-canendatos-d3 .ced-method-flow-title::before { content:""; display:inline-block; width:18px; height:2px; background:var(--ced-accent); border-radius:99px; }
    #ced-canendatos-d3 .ced-method-flow-steps { display:grid; grid-template-columns:repeat(5, minmax(0,1fr)); gap:10px; }
    #ced-canendatos-d3 .ced-method-flow-step { position:relative; background:var(--ced-surface); border:1px solid var(--ced-line); border-radius:8px; padding:11px 12px 10px; display:grid; gap:4px; min-width:0; }
    #ced-canendatos-d3 .ced-method-flow-step::after { content:""; position:absolute; right:-7px; top:50%; width:12px; height:12px; transform:translateY(-50%) rotate(45deg); background:var(--ced-surface); border-top:1px solid var(--ced-line); border-right:1px solid var(--ced-line); z-index:2; }
    #ced-canendatos-d3 .ced-method-flow-step:last-child::after { display:none; }
    #ced-canendatos-d3 .ced-method-flow-num { font-size:10px; font-weight:800; color:var(--ced-accent); letter-spacing:.08em; }
    #ced-canendatos-d3 .ced-method-flow-step strong { font-size:13px; color:var(--ced-ink); font-weight:760; }
    #ced-canendatos-d3 .ced-method-flow-step span { font-size:11.5px; color:var(--ced-muted); line-height:1.35; }
    #ced-canendatos-d3 .ced-method-cards { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; }
    #ced-canendatos-d3 .ced-method-item { position:relative; border:1px solid var(--ced-line); border-top:3px solid var(--ced-accent); border-radius:10px; padding:18px 16px 14px; background:var(--ced-surface); display:flex; flex-direction:column; gap:8px; transition:transform .15s ease, box-shadow .15s ease; }
    #ced-canendatos-d3 .ced-method-item:hover { transform:translateY(-2px); box-shadow:var(--ced-shadow); }
    #ced-canendatos-d3 .ced-method-num { position:absolute; top:-12px; left:14px; background:var(--ced-accent); color:#fff; width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800; box-shadow:0 4px 10px rgba(20,32,25,.18); }
    #ced-canendatos-d3 .ced-method-icon { width:38px; height:38px; border-radius:9px; background:var(--ced-accent-soft); color:var(--ced-accent-deep); display:flex; align-items:center; justify-content:center; margin-top:4px; }
    #ced-canendatos-d3 .ced-method-icon svg { width:20px; height:20px; display:block; }
    #ced-canendatos-d3 .ced-method-item h3 { margin:0; font-size:15px; color:var(--ced-ink); font-weight:760; line-height:1.25; }
    #ced-canendatos-d3 .ced-method-item p { margin:0; color:var(--ced-ink); font-size:13.5px; line-height:1.55; opacity:.85; }
    #ced-canendatos-d3 .ced-method-item p code, #ced-canendatos-d3 .ced-method-item p strong { color:var(--ced-accent-deep); }
    #ced-canendatos-d3 .ced-method-item p code { background:var(--ced-accent-soft); padding:1px 5px; border-radius:4px; font-size:12px; }
    #ced-canendatos-d3 .ced-source-strip { border-top:1px solid var(--ced-line); padding:12px 16px; color:var(--ced-muted); font-size:12px; display:flex; flex-wrap:wrap; gap:8px 18px; justify-content:space-between; background:#fbfcfd; }
    #ced-canendatos-d3 .ced-axis text { fill:var(--ced-muted); font-size:11.5px; }
    #ced-canendatos-d3 .ced-axis path, #ced-canendatos-d3 .ced-axis line { stroke:var(--ced-line); }
    #ced-canendatos-d3 .ced-grid line { stroke:var(--ced-soft); }
    #ced-canendatos-d3 svg { width:100%; height:auto; display:block; overflow:visible; }
    #ced-canendatos-d3 .ced-map-region { transition:fill .15s ease, stroke-width .15s ease; cursor:pointer; }
    #ced-canendatos-d3 .ced-map-region:hover { stroke:var(--ced-ink); stroke-width:2px; }
    #ced-canendatos-d3 .ced-tooltip { position:fixed; z-index:999999; pointer-events:none; background:rgba(20,32,25,.96); color:#fff; padding:10px 12px; border-radius:7px; font-size:12px; line-height:1.45; opacity:0; transform:translate(-50%, calc(-100% - 10px)); min-width:160px; box-shadow:0 10px 30px rgba(0,0,0,.25); }
    #ced-canendatos-d3 .ced-tooltip strong { display:block; font-size:13px; margin-bottom:3px; color:#fff; }
    #ced-canendatos-d3 .ced-tooltip-metric { display:block; margin:1px 0 4px; color:#cfe6d8; font-size:11px; line-height:1.25; font-weight:600; }
    #ced-canendatos-d3 .ced-tooltip-value { display:block; margin:5px 0 4px; color:#fff; font-size:20px; line-height:1.1; font-weight:800; text-align:center; }
    #ced-canendatos-d3 .ced-tooltip-extra { display:block; color:#cfe6d8; font-size:11px; margin-top:4px; }
    #ced-canendatos-d3 .ced-loading { color:var(--ced-muted); padding:24px; }
    #ced-canendatos-d3 .ced-legend { display:flex; gap:14px; align-items:center; flex-wrap:wrap; padding:6px 0 0; font-size:12px; color:var(--ced-muted); }
    #ced-canendatos-d3 .ced-legend-swatch { display:inline-block; width:14px; height:14px; border-radius:3px; margin-right:6px; vertical-align:middle; }

    /* Matriz de variables (Cómo se construye) -------------------------------- */
    #ced-canendatos-d3 .ced-vm { border:1px solid var(--ced-line); border-radius:10px; background:var(--ced-surface); overflow:hidden; }
    #ced-canendatos-d3 .ced-vm .ced-method-flow-title { margin:14px 16px 12px; }
    #ced-canendatos-d3 .ced-vm-table { width:100%; border-collapse:collapse; font-size:13px; line-height:1.45; }
    #ced-canendatos-d3 .ced-vm-table th { background:var(--ced-accent-deep); color:#fff; text-align:left; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; padding:9px 12px; }
    #ced-canendatos-d3 .ced-vm-table td { padding:11px 12px; border-top:1px solid var(--ced-line); vertical-align:top; color:var(--ced-ink); }
    #ced-canendatos-d3 .ced-vm-table tbody tr:nth-child(even) td { background:#fbfcfd; }
    #ced-canendatos-d3 .ced-vm-name { min-width:150px; }
    #ced-canendatos-d3 .ced-vm-name strong { display:block; font-weight:760; color:var(--ced-accent-deep); }
    #ced-canendatos-d3 .ced-vm-sub { display:block; margin-top:3px; color:var(--ced-muted); font-size:12px; }
    #ced-canendatos-d3 .ced-vm-pill { display:inline-block; white-space:nowrap; border:1px solid var(--ced-line); border-radius:999px; padding:2px 8px; font-size:11px; font-weight:700; background:var(--ced-soft); color:var(--ced-muted); }
    #ced-canendatos-d3 .ced-vm-pill[data-sexo="observado"] { background:var(--ced-accent-soft); border-color:var(--ced-accent); color:var(--ced-accent-deep); }
    #ced-canendatos-d3 .ced-vm-pill[data-sexo="estimado"] { background:var(--ced-contrast-soft); border-color:var(--ced-contrast); color:var(--ced-ink); }
    #ced-canendatos-d3 .ced-vm-serie { white-space:nowrap; font-variant-numeric:tabular-nums; }
    #ced-canendatos-d3 .ced-vm-foot { margin:0; padding:10px 16px 13px; border-top:1px solid var(--ced-line); color:var(--ced-muted); font-size:12px; }

    /* Filtro de género: la nota «(No desagregado)» o «(Estimación)» va en
       pequeño. Un <select> nativo no admite dos cuerpos de letra en una misma
       opción, así que donde el navegador soporta el select personalizable se
       usa ese; en el resto la nota sale en el mismo cuerpo, que dice lo mismo.
       Sólo con ratón: en táctil se deja el selector del sistema. */
    @supports (appearance: base-select) {
      @media (hover:hover) and (pointer:fine) {
        #ced-canendatos-d3 select[data-ced-gender],
        #ced-canendatos-d3 select[data-ced-gender]::picker(select) { appearance:base-select; }
        #ced-canendatos-d3 select[data-ced-gender] { display:flex; align-items:center; padding:0 12px 0 10px; }
        /* Mismo chevrón fino que los otros dos selectores, no el triángulo
           macizo que trae el select personalizable. */
        #ced-canendatos-d3 select[data-ced-gender]::picker-icon {
          content:""; width:6px; height:6px; margin:0 2px -1px auto;
          border-right:1.5px solid currentColor; border-bottom:1.5px solid currentColor;
          transform:translateY(-3px) rotate(45deg); transition:none;

      existing.addEventListener("error", () => cb(null));

  function withTimeout(promise, ms, label) {
    let to;
    const timer = new Promise((_, reject) => {
      to = setTimeout(() => reject(new Error(`Timeout (${ms}ms): ${label}`)), ms);
    });
    return Promise.race([promise, timer]).finally(() => clearTimeout(to));

  }

  // Números en español: coma decimal y punto de millares. D3 viene con el

        { h:"Brecha de género",   p:"El salario destinado al alquiler y los hogares monoparentales se publican por sexo. Para los cuatro indicadores de la ECV, el INE sólo publica la diferencia entre hombres y mujeres para el conjunto del Estado: se aplica esa diferencia a cada comunidad, así que la brecha es una <strong>estimación</strong> y en los años con dato publicado es igual en todas. Los precios no están desagregados por sexo." },

  /* Recuento de lo que hay publicado, para que quien lo enseñe no tenga
     que escribir la cifra a mano y se le quede vieja. Se publica en el
     propio nodo raíz: así lo puede leer la capa móvil —que no ve este
     ámbito— sin que haya que exportar nada global. */
  root.dataset.cedIndicadores = String(
    Object.values(SECTIONS).reduce((n, s) => n + Object.keys(s.metrics).length, 0));
  root.dataset.cedAreas = String(Object.keys(SECTIONS).length);

  // Stub para secciones futuras que aparezcan grises en los tabs
  const COMING_SOON = [
    { id:"presupuestos", label:"Presupuestos", tagline:"Gasto social autonómico, por programas y sobre el PIB.",
      note:"En revisión: la asignación de programas presupuestarios a conceptos está siendo depurada antes de publicar la sección." }
  ];

  // ====== Loaders ==========================================================
  function supabaseFetchAll(table, schema) {
    const url = root.dataset.supabaseUrl;
    const key = root.dataset.supabaseKey;
    if (!url || !key) return Promise.reject(new Error("Base de datos no configurada"));
    const pageSize = 1000;
    const all = [];
    function page(offset) {
      const ctrl = (typeof AbortController !== "undefined") ? new AbortController() : null;
      const to = ctrl ? setTimeout(() => ctrl.abort(), 12000) : null;
      return fetch(`${url}/rest/v1/${encodeURIComponent(table)}?select=*&limit=${pageSize}&offset=${offset}`,
        { headers: { apikey:key, Authorization:`Bearer ${key}`, "Accept-Profile":schema },
          signal: ctrl ? ctrl.signal : undefined })
        .then(r => { if (to) clearTimeout(to); if (!r.ok) return r.text().then(t => { throw new Error(`${table} ${r.status}: ${t}`); }); return r.json(); })
        .then(rows => { all.push(...rows); if (rows.length < pageSize) return all; return page(offset + pageSize); })
        .catch(err => { if (to) clearTimeout(to); throw err; });
    }
    return page(0);
  }

  // -- Salud mental ---------------------------------------------------------
  function loadSaludMental(cfg) {
    const NUMERIC = ["t_mental","antidep_ajustado","hipno_ajustado","suicidios","brecha_rel","censo",
                     "n_personas_tm","antidep_anual_total","hipno_anual_total","n_suicidios"];
    return supabaseFetchAll("ced_saludmental", cfg.supabase.schema).then(rows => {
      return rows.map(d => {
        const periodKey = parsePeriodKey(d.periodo, cfg.granularity);
        if (!periodKey) return null;
        const out = { ccaa: normalizeCcaa(d.ccaa), genero: d.genero || "total", origen: d.origen || "real",
                      period: periodKey,
                      periodo: periodKeyToNum(periodKey, cfg.granularity) };
        NUMERIC.forEach(k => out[k] = num(d[k]));
        return out;
      }).filter(r => r && r.ccaa);
    });
  }

  // -- Vivienda -------------------------------------------------------------
  // Las dos tablas (global + género) tienen una columna por métrica con su sufijo
  // _origen y opcionalmente _periodo_label. Aplanamos a {ccaa, periodo, genero, origen, [metric]}.
  function loadVivienda(cfg) {
    return Promise.all([
      supabaseFetchAll("ced_vivienda_global", cfg.supabase.schema).catch(() => []),
      supabaseFetchAll("ced_vivienda_gen",    cfg.supabase.schema).catch(() => [])
    ]).then(([globalRows, genderRows]) => {
      const metricKeys = Object.keys(cfg.metrics);
      function flatten(rows, defaultGender) {
        // Agregamos por (ccaa, periodo_año, genero, origen) — si la fuente trae meses para precios,
        // tomamos la media anual para mantener la grilla anual del hub.
        //
        // El origen va en la clave porque las tablas guardan en filas distintas
        // lo real y lo proyectado de un mismo año: en 2021, por ejemplo, los
        // hogares monoparentales ya son proyección y los precios siguen siendo
        // dato. Fundidas en un solo cubo, la fila heredaba el origen de la que
        // llegara primero y el tooltip podía llamar «dato real» a una
        // proyección. Separadas, cada métrica sólo tiene valor en su fila, y
        // los render —que filtran por métrica no nula— leen su propio origen.
        const buckets = new Map();
        rows.forEach(d => {
          const ccaa = normalizeCcaa(d.ccaa);
          if (!ccaa) return;
          const periodKey = parsePeriodKey(d.periodo ?? d.anio ?? d.year ?? d.fecha, cfg.granularity);
          if (!periodKey) return;
          const periodNum = periodKeyToNum(periodKey, cfg.granularity);
          const gen = (d.genero || d.sexo || defaultGender || "total").toLowerCase();
          const origen = d.origen || "real";
          const key = `${ccaa}|${periodKey}|${gen}|${origen}`;
          let bucket = buckets.get(key);
          if (!bucket) {
            bucket = { ccaa, period: periodKey, periodo: periodNum, genero: gen, origen, _counts:{} };
            metricKeys.forEach(k => { bucket[k] = null; bucket._counts[k] = 0; });
            buckets.set(key, bucket);
          }
          metricKeys.forEach(k => {
            const v = num(d[k]);
            if (v == null) return;
            bucket[k] = (bucket._counts[k] === 0) ? v : ((bucket[k] * bucket._counts[k]) + v) / (bucket._counts[k] + 1);
            bucket._counts[k] += 1;
          });
          // Si alguna métrica viene marcada como proyección, la fila lo es.
          metricKeys.forEach(k => { if (d[`${k}_origen`] === "proyeccion") bucket.origen = "proyeccion"; });
        });
        return Array.from(buckets.values()).map(b => { delete b._counts; return b; });
      }
      const flat = flatten(globalRows, "total").concat(flatten(genderRows, null));
      return flat;
    });
  }

  // -- Dependencia ----------------------------------------------------------
  // Granularidad MENSUAL desde 2023. Sólo se lee la tabla global. La de género
  // repartía cobertura, solicitudes y limbos con la proporción de mujeres
  // entre las personas CUIDADORAS familiares, que no es la de las personas
  // dependientes; el IMSERSO no publica esa desagregación por comunidad, así
  // que la sección la presenta como no desagregada y no la descarga. Usa `ppd`
  // como peso para la media estatal ponderada si la tabla lo trae (campo
  // `censo` = ppd para que stateMean lo aproveche).
  function loadDependencia(cfg) {
    const metricKeys = Object.keys(cfg.metrics);
    return supabaseFetchAll("ced_dependencia_global", cfg.supabase.schema).catch(() => []).then(rows => {
      return rows.map(d => {
        const ccaa = normalizeCcaa(d.ccaa);
        if (!ccaa) return null;
        const periodKey = parsePeriodKey(d.fecha ?? d.periodo, "monthly");
        if (!periodKey) return null;
        const out = {
          ccaa,
          period: periodKey,
          periodo: periodKeyToNum(periodKey, "monthly"),
          genero: "total",
          origen: d.origen || "real",
          censo: num(d.ppd) || null   // PPD como peso para stateMean ponderado
        };
        metricKeys.forEach(k => out[k] = num(d[k]));
        return out;
      }).filter(Boolean);
    });
  }

  // -- Educación ------------------------------------------------------------
  // Granularidad ANUAL 2015-2026. `ced_educacion_global` lleva un único
  // `origen` por fila y una columna por indicador (los 10). `ced_educacion_gen`
  // añade el desglose hombres/mujeres/total para los 8 indicadores con sexo
  // (los 2 de gasto son sólo-total). Servimos el "total" desde global —más
  // completo, incluye el gasto— y de gen tomamos sólo hombres/mujeres para no
  // duplicar la fila total. Sin peso poblacional: la media estatal es simple.
  function loadEducacion(cfg) {
    const metricKeys = Object.keys(cfg.metrics);
    function mapRow(d, genero) {
      const ccaa = normalizeCcaa(d.ccaa);
      if (!ccaa) return null;
      const periodKey = parsePeriodKey(d.periodo ?? d.anio ?? d.year, cfg.granularity);
      if (!periodKey) return null;
      const out = {
        ccaa,
        period: periodKey,
        periodo: periodKeyToNum(periodKey, cfg.granularity),
        genero,
        origen: d.origen || "real"
      };
      metricKeys.forEach(k => out[k] = num(d[k]));
      return out;
    }
    return Promise.all([
      supabaseFetchAll("ced_educacion_global", cfg.supabase.schema).catch(() => []),
      supabaseFetchAll("ced_educacion_gen",    cfg.supabase.schema).catch(() => [])
    ]).then(([globalRows, genderRows]) => {
      const total = globalRows.map(d => mapRow(d, "total")).filter(Boolean);
      const gendered = genderRows
        .filter(d => {
          const g = String(d.genero || "").toLowerCase().trim();
          return g === "hombres" || g === "mujeres";
        })
        .map(d => mapRow(d, String(d.genero).toLowerCase().trim()))
        .filter(Boolean);
      return total.concat(gendered);
    });
  }

  // -- Sanidad --------------------------------------------------------------
  // Granularidad ANUAL (serie larga desde ~1990). `global_sanidad` NO tiene
  // columna genero: cada fila es el total (le asignamos genero:"total") y trae
  // las 11 metricas de display + poblacion_total. `gen_sanidad` aporta SOLO
  // hombres/mujeres para los 3 indicadores de resultado con desglose oficial
  // del INCLASNS (mort_evitable_idx_0_100, avs_65, reingresos_psiq). Servimos el
  // total desde global y de gen tomamos solo hombres/mujeres para no duplicar la
  // clave (ccaa, periodo, genero). `poblacion_total` -> censo, para que stateMean
  // calcule una media estatal ponderada por poblacion. Se ignora `ccaa_cod`.
  //
  // Un año puede traer dos filas, una con lo real y otra con lo proyectado, y
  // la población sólo viene en la de su origen. Se reparte a la otra para que
  // la media estatal de un indicador proyectado siga ponderada.
  function loadSanidad(cfg) {
    const metricKeys = Object.keys(cfg.metrics);
    function mapRow(d, genero) {
      const ccaa = normalizeCcaa(d.ccaa);
      if (!ccaa) return null;
      const periodKey = parsePeriodKey(d.periodo, cfg.granularity);
      if (!periodKey) return null;
      const out = {
        ccaa,
        period: periodKey,
        periodo: periodKeyToNum(periodKey, cfg.granularity),
        genero,
        origen: d.origen || "real",
        censo: num(d.poblacion_total)
      };
      metricKeys.forEach(k => out[k] = num(d[k]));
      return out;
    }
    return Promise.all([
      supabaseFetchAll("global_sanidad", cfg.supabase.schema).catch(() => []),
      supabaseFetchAll("gen_sanidad",    cfg.supabase.schema).catch(() => [])
    ]).then(([globalRows, genderRows]) => {
      const total = globalRows.map(d => mapRow(d, "total")).filter(Boolean);
      const gendered = genderRows
        .filter(d => {
          const g = String(d.genero || "").toLowerCase().trim();
          return g === "hombres" || g === "mujeres";
        })
        .map(d => mapRow(d, String(d.genero).toLowerCase().trim()))
        .filter(Boolean);
      const rows = total.concat(gendered);
      const censoPor = new Map();
      rows.forEach(r => { if (r.censo) censoPor.set(`${r.ccaa}|${r.period}|${r.genero}`, r.censo); });
      rows.forEach(r => { if (!r.censo) r.censo = censoPor.get(`${r.ccaa}|${r.period}|${r.genero}`) || null; });
      return rows;
    });
  }

  // -- Empleo ---------------------------------------------------------------
  // Granularidad ANUAL 2010-2026. `ced_empleo_global` lleva `ccaa_cod` (se
  // ignora), un `origen` global y `_origen` por métrica para brecha_salarial y
  // pct_alquiler_salario. `ced_empleo_gen` trae el género en SINGULAR
  // (hombre/mujer) → se normaliza a plural (convención del master). El total
  // sale de global (más completo, 10 métricas); de gen solo hombres/mujeres.
  // Sin peso poblacional: la media estatal es simple.
  function loadEmpleo(cfg) {
    const metricKeys = Object.keys(cfg.metrics);
    const PROJ_FLAGS = ["brecha_salarial_origen", "pct_alquiler_salario_origen"];
    function normalizeGenero(raw, fallback) {
      const s = String(raw || fallback || "total").toLowerCase().trim();
      if (s === "hombre" || s === "hombres" || s === "h" || s === "male")   return "hombres";
      if (s === "mujer"  || s === "mujeres" || s === "m" || s === "female") return "mujeres";
      return s || "total";
    }
    function mapRow(d, genero) {
      const ccaa = normalizeCcaa(d.ccaa);
      if (!ccaa) return null;
      const periodKey = parsePeriodKey(d.periodo ?? d.anio ?? d.year, cfg.granularity);
      if (!periodKey) return null;
      let origen = d.origen || "real";
      PROJ_FLAGS.forEach(f => { if (d[f] === "proyeccion") origen = "proyeccion"; });
      const out = {
        ccaa,
        period: periodKey,
        periodo: periodKeyToNum(periodKey, cfg.granularity),
        genero,
        origen
      };
      metricKeys.forEach(k => out[k] = num(d[k]));
      return out;
    }
    return Promise.all([
      supabaseFetchAll("ced_empleo_global", cfg.supabase.schema).catch(() => []),
      supabaseFetchAll("ced_empleo_gen",    cfg.supabase.schema).catch(() => [])
    ]).then(([globalRows, genderRows]) => {
      const total = globalRows.map(d => mapRow(d, "total")).filter(Boolean);
      const gendered = genderRows
        .map(d => mapRow(d, normalizeGenero(d.genero)))
        .filter(r => r && (r.genero === "hombres" || r.genero === "mujeres"));
      return total.concat(gendered);
    });
  }

  function parseYear(v) {
    if (v == null || v === "") return NaN;
    if (typeof v === "number" && Number.isFinite(v)) return v >= 1900 ? Math.floor(v) : NaN;
    const s = String(v).trim();
    const m = s.match(/(\d{4})/);
    return m ? +m[1] : NaN;
  }

  // ====== Helpers de periodo (granularidad anual o mensual) ================
  // Cada seccion declara `granularity` ("annual" | "monthly"). El estado
  // mantiene `state.period` como string canonico ("2025" para anual,
  // "2025-03" para mensual). Cada fila de datos lleva tanto `period` (string,
  // para filtros y dropdowns) como `periodo` (numero, para el eje X de la
  // serie temporal: año entero o ano + (mes-1)/12 fraccional).
  const MONTH_NAMES_ES_SHORT = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
  const MONTH_NAMES_ES_LONG  = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];

  function parsePeriodKey(value, granularity) {
    if (value == null || value === "") return null;
    const s = String(value).trim();
    if (granularity === "monthly") {
      const m = s.match(/^(\d{4})[-/](\d{1,2})/);
      if (!m) return null;
      const y = +m[1], mo = +m[2];
      if (!(mo >= 1 && mo <= 12)) return null;
      return `${y}-${String(mo).padStart(2, "0")}`;
    }
    const yr = parseYear(s);
    return Number.isFinite(yr) ? String(yr) : null;
  }

  function periodKeyToNum(periodKey, granularity) {
    if (!periodKey) return NaN;
    if (granularity === "monthly") {
      const [y, mo] = periodKey.split("-").map(Number);
      return y + (mo - 1) / 12;
    }
    return +periodKey;
  }

  function formatPeriodLabel(periodKey, granularity, opts = {}) {
    if (!periodKey) return "";
    if (granularity === "monthly") {
      const [y, mo] = periodKey.split("-");
      const names = opts.long ? MONTH_NAMES_ES_LONG : MONTH_NAMES_ES_SHORT;
      return `${names[+mo - 1]} ${y}`;
    }
    return periodKey;
  }

  function comparePeriodKeys(a, b) {
    // Funciona tanto para "2025" como "2025-03": orden lexicografico = orden temporal
    return a < b ? -1 : a > b ? 1 : 0;
  }

  function loadGeo() {
    const url = root.getAttribute("data-geojson-url");
    return withTimeout(d3.json(url), 12000, "geojson").then(geo => {
      geo.features = geo.features.filter(f => /^ES\d{2}$/.test(f.properties.NUTS_ID || f.properties.id));
      return geo;
    }).catch(() => null);
  }

  // ====== Estado global ====================================================
  // state.period es un string canonico:
  //   - secciones anuales:   "2025"
  //   - secciones mensuales: "2025-03"
  // La granularidad se lee de SECTIONS[state.section].granularity.
  const state = {
    section: root.dataset.section || "vivienda",
    metric: null,
    gender: "total",
    period: null,
    step: "context",
    geo: null,
    cache: {}, // section.id -> { rows, byKey, error }
    sectionState: {} // section.id -> { metric, period, step, gender }
  };

  // ====== Helpers DOM ======================================================
  const $ = sel => root.querySelector(sel);
  const $$ = sel => Array.from(root.querySelectorAll(sel));
  const tooltip = $("[data-ced-tooltip]");
  function showTip(html, evt) { tooltip.innerHTML = html; tooltip.style.left = evt.clientX+"px"; tooltip.style.top = evt.clientY+"px"; tooltip.style.opacity = 1; }
  function moveTip(evt) { tooltip.style.left = evt.clientX+"px"; tooltip.style.top = evt.clientY+"px"; }
  function hideTip() { tooltip.style.opacity = 0; }
  document.addEventListener("mousemove", moveTip);

  // ====== Antesala de carga ================================================
  const bootstrap = $("[data-ced-bootstrap]");
  const tasksEl   = $("[data-ced-bootstrap-tasks]");
  const fillEl    = $("[data-ced-bootstrap-fill]");
  const tasks = []; // { id, label, state, el }

  function addTask(id, label) {
    const el = document.createElement("div");
    el.className = "ced-bootstrap-task";
    el.dataset.cedTask = id;
    el.dataset.state = "loading";
    el.innerHTML = `<span class="ced-bootstrap-dot"></span><span>${label}</span><small>cargando…</small>`;
    tasksEl.appendChild(el);
    const t = { id, label, state:"loading", el };
    tasks.push(t);
    updateProgress();
    return t;
  }
  function setTask(id, status, note) {
    const t = tasks.find(t => t.id === id); if (!t) return;
    t.state = status;
    t.el.dataset.state = status;
    const small = t.el.querySelector("small");
    if (small) small.textContent = note || (status === "ok" ? "listo" : status === "err" ? "error" : "cargando…");
    updateProgress();
  }
  function updateProgress() {
    const done = tasks.filter(t => t.state !== "loading").length;
    const pct = tasks.length === 0 ? 0 : (done / tasks.length) * 100;
    fillEl.style.width = pct + "%";
  }
  function hideBootstrap() {
    bootstrap.classList.add("is-hidden");
    setTimeout(() => { bootstrap.style.display = "none"; }, 400);
  }

  // ====== Renderizado del chasis ==========================================
  const els = {
    eyebrow: $("[data-ced-eyebrow]"), h2: $("[data-ced-h2]"), lead: $("[data-ced-lead]"),
    metricSel: $("[data-ced-metric]"), yearSel: $("[data-ced-year]"), genderSel: $("[data-ced-gender]"),
    title: $("[data-ced-title]"), sub: $("[data-ced-sub]"), badge: $("[data-ced-badge]"),
    chart: $("[data-ced-chart]"), kpis: $("[data-ced-kpis]"),
    methodGrid: $("[data-ced-method-grid]"),
    sourceLeft: $("[data-ced-source-left]"), sourceRight: $("[data-ced-source-right]"),
    sectionsNav: $("[data-ced-sections]"), genderControl: $("[data-ced-gender]").parentElement,
    storyNav: $("[data-ced-story]")
  };

  function renderSectionTabs() {
    const items = Object.values(SECTIONS).map(s => ({ id:s.id, label:s.label, tagline:s.tagline, available:true }))
      .concat(COMING_SOON.map(s => ({ ...s, available:false })));
    els.sectionsNav.innerHTML = items.map(s => `
      <button type="button" class="ced-section-btn ${state.section===s.id?'is-active':''}"
              data-ced-section-btn="${s.id}" data-coming="${!s.available}"
              ${s.available ? "" : `aria-disabled="true" tabindex="-1"`}
              ${s.note ? `title="${s.note}"` : ""}>
        <strong>${s.label}</strong><span>${s.tagline}</span>
      </button>`).join("");
    els.sectionsNav.querySelectorAll("[data-ced-section-btn]").forEach(btn => {
      btn.addEventListener("click", () => {
        if (btn.dataset.coming === "true") return;
        const next = btn.dataset.cedSectionBtn;
        if (next === state.section) return;
        switchSection(next);
      });
    });
  }

  function applySectionTheme(sectionId) {
    root.dataset.section = sectionId;
  }

  function persistSectionState() {
    state.sectionState[state.section] = {
      metric: state.metric, period: state.period, step: state.step, gender: state.gender
    };
  }

  // Periodos (claves canonicas en string) con al menos una fila valida para
  // (seccion actual, metrica, genero). Si la combinacion no tiene datos, se
  // hace fallback al genero total. Devuelve array de strings ordenados
  // cronologicamente (orden lexicografico = orden temporal porque el formato
  // "yyyy" o "yyyy-mm" es zero-padded).
  function availablePeriodsFor(metric, gender) {
    const cache = state.cache[state.section];
    if (!cache || !cache.rows || !metric) return [];
    let rows = cache.rows.filter(r => r.genero === gender && r[metric] != null);
    if (rows.length === 0 && gender !== "total") {
      rows = cache.rows.filter(r => r.genero === "total" && r[metric] != null);
    }
    return Array.from(new Set(rows.map(r => r.period))).filter(Boolean).sort(comparePeriodKeys);
  }

  // Elige el mejor periodo dado uno preferido (mantenerlo si esta, si no el mas reciente).
  function bestPeriodFor(metric, gender, preferred) {
    const periods = availablePeriodsFor(metric, gender);
    if (periods.length === 0) return null;
    if (preferred != null && periods.includes(preferred)) return preferred;
    return periods[periods.length - 1];
  }

  // ¿La sección actual tiene filas con género hombres/mujeres para esta métrica?
  function genderAvailable(metric) {
    const cache = state.cache[state.section];
    if (!cache || !cache.rows) return false;
    return cache.rows.some(r => (r.genero === "hombres" || r.genero === "mujeres") && r[metric] != null);
  }

  function restoreSectionState(sectionId) {
    const cfg = SECTIONS[sectionId];
    const cache = state.cache[sectionId];
    const saved = state.sectionState[sectionId] || {};
    const metricKeys = Object.keys(cfg.metrics);

    state.metric = saved.metric && cfg.metrics[saved.metric] ? saved.metric : metricKeys[0];

    // Género: respetar guardado si la sección lo soporta y existe esa desagregación
    // para la métrica restaurada. Si no, caer a total.
    let gender = saved.gender || "total";
    if (!cfg.hasGender) gender = "total";
    if (gender !== "total" && cache && cache.rows && !genderAvailable(state.metric)) gender = "total";
    if (gender !== "total" && cfg.genderFilterNotes && cfg.metrics[state.metric].sexo === "no") gender = "total";
    state.gender = gender;

    // Step: si el guardado es "gender" pero la sección destino no soporta género,
    // caer al primer capítulo.
    let step = saved.step || "context";
    if (step === "gender" && !cfg.hasGender) step = "context";
    state.step = step;

    // Periodo: limitarlo a los periodos disponibles para (metrica, genero) actual.
    state.period = bestPeriodFor(state.metric, state.gender, saved.period);
  }

  function switchSection(sectionId) {
    persistSectionState();
    state.section = sectionId;
    applySectionTheme(sectionId);
    restoreSectionState(sectionId);
    els.sectionsNav.querySelectorAll("[data-ced-section-btn]").forEach(b => {
      b.classList.toggle("is-active", b.dataset.cedSectionBtn === sectionId);
    });
    syncStoryNavActive();
    renderShellForSection();
    render();
  }

  function syncStoryNavActive() {
    $$("[data-ced-step]").forEach(b => b.classList.toggle("is-active", b.dataset.cedStep === state.step));
  }

  function renderShellForSection() {
    const cfg = SECTIONS[state.section];
    els.eyebrow.textContent = cfg.eyebrow;
    els.h2.textContent = cfg.title;
    els.lead.textContent = cfg.lead;
    els.sourceLeft.textContent = cfg.sourceLeft;
    els.sourceRight.textContent = cfg.sourceRight;

    // Selector de métrica
    els.metricSel.innerHTML = "";
    Object.entries(cfg.metrics).forEach(([k,v]) => {
      const opt = document.createElement("option"); opt.value = k; opt.textContent = v.label;
      els.metricSel.appendChild(opt);
    });
    els.metricSel.value = state.metric;

    // Selector de periodo (filtrado a periodos con dato para metrica+genero actuales)
    rebuildPeriodSelector();

    // Mostrar/ocultar selector de género según soporte de la sección
    els.genderControl.style.display = cfg.hasGender ? "" : "none";
    syncGenderOptions();
    els.genderSel.value = state.gender;

    // Story steps: ocultar paso de género si no aplica
    els.storyNav.querySelector('[data-ced-step="gender"]').style.display = cfg.hasGender ? "" : "none";

    // Metodología (pipeline + tarjetas con icono)
    els.methodGrid.innerHTML = renderMethodHtml(cfg);
  }

  // ====== Metodología visual ==============================================
  const METHOD_ICONS = {
    database: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14a9 3 0 0 0 18 0V5"/><path d="M3 12a9 3 0 0 0 18 0"/></svg>',
    clock:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>',
    chart:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>',
    users:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
    tag:      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>',
    cloud:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/></svg>',
    layers:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>',
    info:     '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>'
  };

  function methodIconFor(heading) {
    const k = String(heading || "").toLowerCase();
    if (k.includes("fuente"))                                                   return METHOD_ICONS.database;
    if (k.includes("actualiza"))                                                return METHOD_ICONS.clock;
    if (k.includes("modelad") || k.includes("estimaci"))                        return METHOD_ICONS.chart;
    if (k.includes("imputaci") || k.includes("género") || k.includes("genero")) return METHOD_ICONS.users;
    if (k.includes("variable") || k.includes("etiqueta") || k.includes("origen"))return METHOD_ICONS.tag;
    if (k.includes("almacen") || k.includes("supabase") || k.includes("workflow"))return METHOD_ICONS.cloud;
    return METHOD_ICONS.layers;
  }

  function renderMethodHtml(cfg) {
    return `
      <div class="ced-method-cards">
        ${cfg.method.map((m, i) => `
          <div class="ced-method-item">
            <span class="ced-method-num">${i + 1}</span>
            <div class="ced-method-icon">${methodIconFor(m.h)}</div>
            <h3>${m.h}</h3>
            <p>${m.p}</p>
          </div>`).join("")}
      </div>
      ${renderVariableMatrix(cfg)}`;
  }

  // Primer y último año con dato de una métrica, separando lo real de lo
  // proyectado. Se lee de las filas cargadas para que la matriz no se quede
  // vieja cuando entra un año nuevo.
  function seriesSpan(sectionId, metric) {
    const cache = state.cache[sectionId];
    const cfg = SECTIONS[sectionId];
    if (!cache || !cache.rows || cache.rows.length === 0) return "—";
    const rows = cache.rows.filter(r => r.genero === "total" && r[metric] != null && r.period);
    const span = rs => {
      if (rs.length === 0) return null;
      const ps = rs.map(r => r.period).sort(comparePeriodKeys);
      const a = formatPeriodLabel(ps[0], cfg.granularity), b = formatPeriodLabel(ps[ps.length - 1], cfg.granularity);
      return a === b ? a : `${a}–${b}`;
    };
    const real = span(rows.filter(r => r.origen !== "proyeccion"));
    const proj = span(rows.filter(r => r.origen === "proyeccion"));
    if (!real && !proj) return "—";
    return [real, proj ? `<span class="ced-vm-sub">Proyección: ${proj}</span>` : ""].filter(Boolean).join("");
  }

  const SEXO_LABELS = {
    observado: { pill:"Sí",              nota:"Publicado por la fuente." },
    estimado:  { pill:"Estimación",      nota:"" },
    no:        { pill:"No desagregado",  nota:"" }
  };

  // Cómo se estima el sexo cambia de una sección a otra; lo declara cada
  // una en genderEstimateNote y se reutiliza en la matriz, el subtítulo y la
  // leyenda de la escena de género.
  // Cómo se nombra la desagregación en los textos de la sección: «sexo» por
  // defecto; Educación pide «género».
  function genderTerm(cfg) { return cfg.genderTerm || "sexo"; }

  function estimateNoteSentence(cfg) {
    const n = cfg.genderEstimateNote;
    return n ? n.charAt(0).toUpperCase() + n.slice(1) + "." : "";
  }

  function renderVariableMatrix(cfg) {
    if (!cfg.variables) return "";
    const rows = Object.keys(cfg.metrics).filter(k => cfg.variables[k]).map(k => {
      const meta = cfg.metrics[k], v = cfg.variables[k];
      const sexo = SEXO_LABELS[meta.sexo] ? meta.sexo : "no";
      const nota = v.sexoNota || (sexo === "estimado" ? estimateNoteSentence(cfg) : SEXO_LABELS[sexo].nota);
      return `
        <tr role="row">
          <td role="cell" class="ced-vm-name"><strong>${meta.label}</strong><span class="ced-vm-sub">${meta.unit}</span></td>
          <td role="cell" data-label="Qué mide y cómo se calcula">${v.mide}<span class="ced-vm-sub">${v.calculo}</span></td>
          <td role="cell" data-label="Fuente">${v.fuente}</td>
          <td role="cell" data-label="Por ${genderTerm(cfg)}"><span class="ced-vm-pill" data-sexo="${sexo}">${SEXO_LABELS[sexo].pill}</span>${nota ? `<span class="ced-vm-sub">${nota}</span>` : ""}</td>
          <td role="cell" data-label="Serie" class="ced-vm-serie">${seriesSpan(cfg.id, k)}</td>
        </tr>`;
    }).join("");
    return `
      <section class="ced-vm" aria-labelledby="ced-vm-title-${cfg.id}">
        <div class="ced-method-flow-title" id="ced-vm-title-${cfg.id}">Matriz de variables</div>
        <table class="ced-vm-table" role="table">
          <thead role="rowgroup">
            <tr role="row">
              <th role="columnheader" scope="col">Indicador</th>
              <th role="columnheader" scope="col">Qué mide y cómo se calcula</th>
              <th role="columnheader" scope="col">Fuente</th>
              <th role="columnheader" scope="col">Por ${genderTerm(cfg)}</th>
              <th role="columnheader" scope="col">Serie</th>
            </tr>
          </thead>
          <tbody role="rowgroup">${rows}</tbody>
        </table>
        ${cfg.variablesNote ? `<p class="ced-vm-foot">${cfg.variablesNote}</p>` : ""}
      </section>`;
  }

  // ====== Opciones del filtro de género ===================================
  // Con genderFilterNotes, cada opción de sexo dice cómo llega el dato del
  // indicador elegido: «No desagregado» (y la opción se desactiva, porque
  // elegirla dejaba el mapa y los KPIs en blanco) o «Estimación». La nota va
  // en su propio <span> para poder pintarla en pequeño; en un select nativo
  // se lee como texto seguido, «Hombres (No desagregado)».
  const GENDER_LABELS = { total:"Total", hombres:"Hombres", mujeres:"Mujeres" };

  function genderNoteFor(metric) {
    const cfg = SECTIONS[state.section];
    if (!cfg.genderFilterNotes || !metric) return null;
    const meta = cfg.metrics[metric];
    // `sexo: "no"` manda aunque haya filas por sexo: una desagregación que la
    // sección ha decidido no presentar no debe colarse por el filtro.
    if (!genderAvailable(metric) || (meta && meta.sexo === "no")) return "No desagregado";
    return meta && meta.sexo === "estimado" ? "Estimación" : null;
  }

  function syncGenderOptions() {
    const note = genderNoteFor(state.metric);
    const blocked = note === "No desagregado";
    Array.from(els.genderSel.options).forEach(opt => {
      const isSex = opt.value !== "total";
      opt.textContent = GENDER_LABELS[opt.value] || opt.value;
      opt.disabled = isSex && blocked;
      if (isSex && note) {
        const span = document.createElement("span");
        span.className = "ced-opt-note";
        span.textContent = ` (${note})`;
        opt.appendChild(span);
      }
    });
  }

  function rebuildPeriodSelector() {
    const cfg = SECTIONS[state.section];
    const periods = availablePeriodsFor(state.metric, state.gender);
    els.yearSel.innerHTML = "";
    periods.forEach(p => {
      const opt = document.createElement("option");
      opt.value = p;
      opt.textContent = formatPeriodLabel(p, cfg.granularity, { long: cfg.granularity === "monthly" });
      els.yearSel.appendChild(opt);
    });
    if (periods.length && !periods.includes(state.period)) state.period = periods[periods.length - 1];
    if (state.period != null) els.yearSel.value = state.period;
  }

  // ====== Eventos ==========================================================
  els.metricSel.addEventListener("change", () => {
    state.metric = els.metricSel.value;
    // Si el indicador nuevo no está desagregado, la opción de sexo elegida
    // queda desactivada: se vuelve al total en vez de enseñar una vista vacía.
    if (genderNoteFor(state.metric) === "No desagregado") state.gender = "total";
    syncGenderOptions();
    // Reajustar periodo al mejor disponible para la nueva metrica con el genero actual
    state.period = bestPeriodFor(state.metric, state.gender, state.period);
    rebuildPeriodSelector();
    render();
  });
  els.yearSel.addEventListener("change", () => {
    state.period = els.yearSel.value;  // string canonico (yyyy o yyyy-mm)
    render();
  });
  els.genderSel.addEventListener("change", () => {
    state.gender = els.genderSel.value;
    state.period = bestPeriodFor(state.metric, state.gender, state.period);
    rebuildPeriodSelector();
    render();
  });
  $$("[data-ced-step]").forEach(btn => btn.addEventListener("click", () => {
    state.step = btn.dataset.cedStep;
    syncStoryNavActive();
    render();
  }));
  $("[data-ced-method]").addEventListener("click", () => {
    state.step = "method";
    syncStoryNavActive();
    render();
  });
  $("[data-ced-download]").addEventListener("click", downloadCsv);

  // Re-render al redimensionar para mantener legends/rankings bien dimensionados
  let resizeTimer = null;
  let lastWidth = root.clientWidth;
  if (typeof ResizeObserver !== "undefined") {
    new ResizeObserver(() => {
      const w = root.clientWidth;
      if (Math.abs(w - lastWidth) < 30) return; // ignorar cambios menores
      lastWidth = w;
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => { if (state.metric) render(); }, 150);
    }).observe(root);
  }

  function downloadCsv() {
    const cfg = SECTIONS[state.section];
    const cache = state.cache[state.section];
    if (!cache || !cache.rows) return;
    // Exportamos period (string canonico) en lugar de periodo (numero) para
    // que el CSV sea legible: "2025-03" en lugar de 2025.166666...
    const cols = ["ccaa","period","genero","origen", ...Object.keys(cfg.metrics)];
    const header = cols.map(c => c === "period" ? "periodo" : c).join(";");
    const lines = [header];
    cache.rows.forEach(r => {
      lines.push(cols.map(c => {
        const v = r[c];
        return v == null ? "" : String(v).replace(/;/g, ",");
      }).join(";"));
    });
    const blob = new Blob([lines.join("\n")], { type:"text/csv;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `ced_${cfg.id}.csv`;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 100);
  }

  // ====== Filtros y métricas auxiliares ===================================
  function rowsForView() {
    const cache = state.cache[state.section];
    if (!cache || !cache.rows) return [];
    return cache.rows.filter(r => r.genero === state.gender);
  }
  function stateMean(metric, periodKey, gender) {
    const cache = state.cache[state.section];
    if (!cache) return null;
    const rs = cache.rows.filter(r => r.period === periodKey && r.genero === gender && r.ccaa !== "Media Estatal" && r[metric] != null);
    if (rs.length === 0) return null;
    const w = d3.sum(rs, r => r.censo || 0);
    if (w > 0) return d3.sum(rs, r => r[metric] * (r.censo || 0)) / w;
    return d3.mean(rs, r => r[metric]);
  }
  function stateSeries(metric, gender) {
    const cache = state.cache[state.section];
    if (!cache) return [];
    // Iteramos por period (string) pero devolvemos periodo (numero) para el eje X.
    const seen = new Map();  // period -> periodo (numero)
    cache.rows.forEach(r => { if (r.period != null && !seen.has(r.period)) seen.set(r.period, r.periodo); });
    const periodKeys = Array.from(seen.keys()).sort(comparePeriodKeys);
    return periodKeys.map(p => ({ period:p, periodo:seen.get(p), value:stateMean(metric, p, gender) }))
      .filter(d => d.value != null);
  }
  function fmtVal(metric, v) {
    const cfg = SECTIONS[state.section].metrics[metric];
    if (v == null) return "—";
    return d3.format(cfg.fmt)(v) + cfg.suffix;
  }

  // ====== KPIs =============================================================
  function renderKpis() {
    const cfg = SECTIONS[state.section];
    const meta = cfg.metrics[state.metric];
    const rows = rowsForView().filter(r => r.period === state.period && r[state.metric] != null);
    const can  = rows.find(r => r.ccaa === "Canarias");
    const ccaaOnly = rows.filter(r => r.ccaa !== "Media Estatal");
    const sorted = ccaaOnly.slice().sort((a,b) => d3.ascending(a[state.metric], b[state.metric]));
    const lo = sorted[0]; const hi = sorted[sorted.length-1];
    const nat = stateMean(state.metric, state.period, state.gender);
    // stateMean sólo pondera si las filas traen población (censo); si no, es
    // la media simple de las comunidades y la nota tiene que decirlo.
    const ponderada = ccaaOnly.some(r => r.censo > 0);
    const periodLabel = formatPeriodLabel(state.period, cfg.granularity, { long: cfg.granularity === "monthly" });
    const cards = [
      { label:`Media estatal · ${periodLabel}`, value: fmtVal(state.metric, nat), note:`${meta.unit} · ${ponderada ? "ponderada" : "media simple"}` },
      { label:`Canarias · ${periodLabel}`,      value: fmtVal(state.metric, can ? can[state.metric] : null),
        note: (can && nat != null && can[state.metric] != null)
          ? `${can[state.metric] >= nat ? "+" : ""}${d3.format(meta.fmt)(can[state.metric] - nat)} vs media`
          : "" },
      { label:"Mínimo CCAA", value: lo ? fmtVal(state.metric, lo[state.metric]) : "—", note: lo ? lo.ccaa : "" },
      { label:"Máximo CCAA", value: hi ? fmtVal(state.metric, hi[state.metric]) : "—", note: hi ? hi.ccaa : "" }
    ];
    els.kpis.innerHTML = cards.map(c => `
      <div class="ced-kpi">
        <div class="ced-kpi-label">${c.label}</div>
        <div class="ced-kpi-value">${c.value}</div>
        <div class="ced-kpi-note">${c.note || ""}</div>
      </div>`).join("");
  }

  // ====== Helpers móvil ====================================================
  function isMobile() { return root.clientWidth < 640; }

  // ====== Render: mapa coroplético =========================================
  function renderMap() {
    const cfg = SECTIONS[state.section];
    const meta = cfg.metrics[state.metric];
    const wrap = els.chart; wrap.innerHTML = "";
    // En móvil, el mapa coroplético no se lee bien: usamos lista de CCAA
    if (isMobile()) { renderMobileList(wrap); return; }
    if (!state.geo) { wrap.innerHTML = `<div class="ced-loading">No se pudo cargar la geometría. Mostrando ranking.</div>`; renderRanking(wrap); return; }

    const w = wrap.clientWidth || 720;
    const h = 480;
    const margin = { top:14, right:20, bottom:58, left:20 };
    const svg = d3.select(wrap).append("svg").attr("viewBox", `0 0 ${w} ${h}`);
    const yearRows = rowsForView().filter(r => r.period === state.period && r[state.metric] != null);
    const valueByCcaa = new Map(yearRows.map(r => [r.ccaa, r]));
    const getCcaa = f => Object.keys(NUTS_FOR_CCAA).find(k => NUTS_FOR_CCAA[k] === (f.properties.NUTS_ID || f.properties.id));

    const mainlandFeatures = state.geo.features.filter(f => getCcaa(f) !== "Canarias");
    const canFeature       = state.geo.features.find(f => getCcaa(f) === "Canarias");
    const mainland = { type:"FeatureCollection", features:mainlandFeatures };

    const projection = d3.geoMercator()
      .fitExtent([[margin.left, margin.top], [w - margin.right, h - margin.bottom]], mainland);
    const path = d3.geoPath(projection);

    const palette = cfg.mapPalette;
    const values  = yearRows.map(r => r[state.metric]).filter(Number.isFinite);
    const extent  = d3.extent(values);
    const uniqueValues = Array.from(new Set(values));
    const color = uniqueValues.length > 1
      ? d3.scaleQuantile().domain(values).range(palette)
      : () => palette[Math.floor(palette.length/2)];

    function fillFor(ccaa) { const r = valueByCcaa.get(ccaa); return r ? color(r[state.metric]) : "#eef3f0"; }
    function tipFor(ccaa, evt) {
      const row = valueByCcaa.get(ccaa);
      const v = row ? row[state.metric] : null;
      const extra = row && meta.extra ? meta.extra(row) : null;
      const periodLabel = formatPeriodLabel(state.period, cfg.granularity, { long: cfg.granularity === "monthly" });
      showTip(`
        <strong>${ccaa}</strong>
        <span class="ced-tooltip-metric">${meta.short} · ${periodLabel}</span>
        <span class="ced-tooltip-value">${fmtVal(state.metric, v)}</span>
        ${extra ? `<span class="ced-tooltip-extra">${extra}</span>` : ""}
        ${row ? `<span class="ced-tooltip-extra">${row.origen === "proyeccion" ? "Proyección" : "Dato real"}</span>` : ""}
      `, evt);
    }

    const mainlandPaths = svg.append("g").selectAll("path").data(mainlandFeatures).join("path")
      .attr("class","ced-map-region")
      .attr("d", path)
      .attr("fill", d => fillFor(getCcaa(d)))
      .attr("stroke", "#fff").attr("stroke-width", 0.7)
      .on("mousemove", function(evt, d) { const c = getCcaa(d); if (c) tipFor(c, evt); })
      .on("mouseleave", hideTip);

    let canRegion = null;
    if (canFeature) {
      const canBounds = path.bounds(canFeature);
      const canW = Math.max(1, canBounds[1][0] - canBounds[0][0]);
      const canH = Math.max(1, canBounds[1][1] - canBounds[0][1]);
      const desiredW = Math.min(150, Math.max(92, w * 0.15));
      const canScale = desiredW / canW;
      const targetX = margin.left + w * 0.04;
      const targetY = h - margin.bottom - Math.max(78, canH * canScale * 0.7);
      const tx = targetX - canBounds[0][0] * canScale;
      const ty = targetY - canBounds[0][1] * canScale;
      const canG = svg.append("g").attr("transform", `translate(${tx},${ty}) scale(${canScale})`);
      canRegion = canG.append("path").datum(canFeature)
        .attr("class","ced-map-region")
        .attr("d", path)
        .attr("fill", fillFor("Canarias"))
        .attr("stroke", "var(--ced-contrast, #142019)").attr("stroke-width", 1.6 / canScale)
        .on("mousemove", evt => tipFor("Canarias", evt))
        .on("mouseleave", hideTip);
      svg.append("text").attr("x", targetX + desiredW/2).attr("y", targetY - 8)
        .attr("text-anchor","middle").attr("fill","var(--ced-accent-deep)")
        .attr("font-size", 12).attr("font-weight", 800).text("Canarias");
    }

    function highlightMembers(names) {
      const set = new Set(names);
      mainlandPaths.attr("opacity", d => set.has(getCcaa(d)) ? 1 : 0.16)
        .attr("stroke", d => set.has(getCcaa(d)) ? "#142019" : "#fff")
        .attr("stroke-width", d => set.has(getCcaa(d)) ? 1.8 : 0.7);
      if (canRegion) canRegion.attr("opacity", set.has("Canarias") ? 1 : 0.16);
    }
    function resetHighlight() {
      mainlandPaths.attr("opacity", 1).attr("stroke","#fff").attr("stroke-width", 0.7);
      if (canRegion) canRegion.attr("opacity", 1);
    }

    // Leyenda por cuantiles
    const legendW = Math.min(360, w - 70);
    const legendX = w - legendW - 20;
    const legendY = h - 36;
    const legendColors = uniqueValues.length > 1 ? palette : [palette[Math.floor(palette.length/2)]];
    const bins = legendColors.map((c, i) => {
      const range = color.invertExtent ? color.invertExtent(c) : extent;
      const members = yearRows.filter(r => color(r[state.metric]) === c)
        .sort((a,b) => d3.descending(a[state.metric], b[state.metric]));
      return { color:c, index:i, min:range[0] ?? extent[0], max:range[1] ?? extent[1], members };
    });
    const segW = legendW / legendColors.length;
    svg.append("g").selectAll("rect.ced-legend-seg").data(bins).join("rect")
      .attr("class","ced-legend-seg")
      .attr("x", (d,i) => legendX + i*segW).attr("y", legendY)
      .attr("width", Math.ceil(segW)).attr("height", 12)
      .attr("rx", (d,i) => i === 0 || i === bins.length-1 ? 4 : 0)
      .attr("fill", d => d.color).attr("cursor","pointer")
      .on("mousemove", function(evt, d) {
        const names = d.members.map(r => r.ccaa);
        highlightMembers(names);
        d3.select(this).attr("stroke","#142019").attr("stroke-width", 1.4);
        const list = names.length ? names.join(", ") : "Sin comunidades";
        showTip(`
          <strong>Tramo ${d.index+1} / ${bins.length}</strong>
          <span class="ced-tooltip-metric">${meta.short} · ${formatPeriodLabel(state.period, cfg.granularity, { long: cfg.granularity === "monthly" })}</span>
          <span class="ced-tooltip-value">${fmtVal(state.metric, d.min)} – ${fmtVal(state.metric, d.max)}</span>
          <span class="ced-tooltip-extra">${list}</span>
        `, evt);
      })
      .on("mouseleave", function() {
        d3.select(this).attr("stroke", null).attr("stroke-width", null);
        resetHighlight(); hideTip();
      });

    svg.append("text").attr("x", legendX).attr("y", legendY - 7)
      .attr("font-size", 11).attr("fill","var(--ced-muted)")
      .text(`${meta.short} (${meta.unit})`);
    svg.append("text").attr("x", legendX + legendW).attr("y", legendY - 7)
      .attr("text-anchor","end").attr("font-size", 10).attr("fill","var(--ced-muted)")
      .text(uniqueValues.length > 1 ? "cuantiles" : "valor único");
    svg.append("text").attr("x", legendX).attr("y", legendY + 26)
      .attr("font-size", 10).attr("fill","var(--ced-muted)")
      .text(extent[0] != null ? d3.format(meta.fmt)(extent[0]) + meta.suffix : "");
    svg.append("text").attr("x", legendX + legendW).attr("y", legendY + 26)
      .attr("text-anchor","end").attr("font-size", 10).attr("fill","var(--ced-muted)")
      .text(extent[1] != null ? d3.format(meta.fmt)(extent[1]) + meta.suffix : "");
  }

  // ====== Render móvil: lista CCAA (sustituye al mapa) ====================
  function renderMobileList(wrap) {
    const cfg = SECTIONS[state.section];
    const meta = cfg.metrics[state.metric];
    const yearRows = rowsForView()
      .filter(r => r.period === state.period && r.ccaa !== "Media Estatal" && r[state.metric] != null);
    if (yearRows.length === 0) {
      wrap.innerHTML = `<div class="ced-loading">Sin datos para esta combinación.</div>`;
      return;
    }
    const max = d3.max(yearRows, r => r[state.metric]);
    // Canarias primero, resto descendente
    const sorted = yearRows.slice().sort((a, b) => d3.descending(a[state.metric], b[state.metric]));
    const rankBy = new Map(sorted.map((r, i) => [r.ccaa, i + 1]));
    const can = sorted.find(r => r.ccaa === "Canarias");
    const others = sorted.filter(r => r.ccaa !== "Canarias");
    const ordered = can ? [can, ...others] : sorted;

    const list = document.createElement("div");
    list.className = "ced-mlist";
    list.innerHTML = ordered.map(r => {
      const pct = max > 0 ? (r[state.metric] / max) * 100 : 0;
      const isCan = r.ccaa === "Canarias";
      const extra = meta.extra ? meta.extra(r) : null;
      const proj = r.origen === "proyeccion" ? " · proy." : "";
      return `
        <div class="ced-mlist-row${isCan ? ' is-canarias' : ''}">
          <div class="ced-mlist-rank">${rankBy.get(r.ccaa)}º</div>
          <div class="ced-mlist-name">${r.ccaa}${proj}</div>
          <div class="ced-mlist-value">${fmtVal(state.metric, r[state.metric])}</div>
          <div class="ced-mlist-bar"><div class="ced-mlist-bar-fill" style="width:${pct.toFixed(1)}%"></div></div>
          ${extra ? `<div class="ced-mlist-extra">${extra}</div>` : ""}
        </div>`;
    }).join("");
    wrap.appendChild(list);
  }

  // Vista de género sin filas que comparar. Si es porque el indicador no está
  // desagregado, se dice eso: «no hay datos para 2025» invita a probar otro
  // año, y no hay año en el que vaya a haberlos.
  function genderEmptyHtml(meta, periodLabel) {
    if (genderNoteFor(state.metric) === "No desagregado") {
      // Si ningún indicador de la sección lo está, no tiene sentido mandar a
      // buscar otro.
      const cfg = SECTIONS[state.section];
      const alguno = Object.keys(cfg.metrics).some(k => genderNoteFor(k) !== "No desagregado");
      return `<div class="ced-loading"><strong>${meta.label}</strong> no está desagregado por ${genderTerm(cfg)} en su fuente. ${alguno
        ? "Elige otro indicador para ver la brecha de género."
        : "En esta sección ningún indicador lo está; «Cómo se construye» explica por qué y dónde leer la perspectiva de género."}</div>`;
    }
    return `<div class="ced-loading">No hay datos por género para ${meta.label} en ${periodLabel}.</div>`;
  }

  // ====== Render móvil: brecha de género (cards apiladas) =================
  function renderMobileGender(wrap) {
    const cfg = SECTIONS[state.section];
    const meta = cfg.metrics[state.metric];
    const cache = state.cache[state.section];
    const all = (cache && cache.rows ? cache.rows : [])
      .filter(r => r.period === state.period && r.ccaa !== "Media Estatal" && r[state.metric] != null);
    const byCcaa = d3.group(all, r => r.ccaa);
    const rows = Array.from(byCcaa, ([ccaa, vs]) => {
      const h = vs.find(r => r.genero === "hombres");
      const m = vs.find(r => r.genero === "mujeres");
      if (!h || !m) return null;
      return { ccaa, men: h[state.metric], women: m[state.metric], gap: m[state.metric] - h[state.metric] };
    }).filter(Boolean).sort((a, b) => d3.descending(Math.abs(a.gap), Math.abs(b.gap)));

    if (rows.length === 0) {
      wrap.innerHTML = genderEmptyHtml(meta, formatPeriodLabel(state.period, cfg.granularity, { long: cfg.granularity === "monthly" }));
      return;
    }
    const maxAbs = d3.max(rows, r => Math.max(r.men, r.women));
    // Canarias primero
    const can = rows.find(r => r.ccaa === "Canarias");
    const ordered = can ? [can, ...rows.filter(r => r.ccaa !== "Canarias")] : rows;

    const list = document.createElement("div");
    list.className = "ced-mgender";
    list.innerHTML = ordered.map(r => {
      const isCan = r.ccaa === "Canarias";
      const wH = maxAbs > 0 ? (r.men   / maxAbs) * 100 : 0;
      const wM = maxAbs > 0 ? (r.women / maxAbs) * 100 : 0;
      const sign = r.gap >= 0 ? "is-pos" : "is-neg";
      const gapTxt = `${r.gap >= 0 ? "+" : ""}${d3.format(meta.fmt)(r.gap)}${meta.suffix}`;
      return `
        <div class="ced-mgender-row${isCan ? ' is-canarias' : ''}">
          <div class="ced-mgender-head">
            <strong>${r.ccaa}</strong>
            <span class="ced-mgender-gap ${sign}">Brecha ${gapTxt}</span>
          </div>
          <div class="ced-mgender-bars">
            <span class="lbl">Hombres</span>
            <span class="bar h"><span style="width:${wH.toFixed(1)}%"></span></span>
            <span class="val">${fmtVal(state.metric, r.men)}</span>
            <span class="lbl">Mujeres</span>
            <span class="bar m"><span style="width:${wM.toFixed(1)}%"></span></span>
            <span class="val">${fmtVal(state.metric, r.women)}</span>
          </div>
        </div>`;
    }).join("");
    wrap.appendChild(list);
  }

  function renderRanking(wrap) {
    const cfg = SECTIONS[state.section];
    const meta = cfg.metrics[state.metric];
    const rows = rowsForView()
      .filter(r => r.period === state.period && r.ccaa !== "Media Estatal" && r[state.metric] != null)
      .sort((a,b) => d3.descending(a[state.metric], b[state.metric]));
    const w = wrap.clientWidth || 720;
    const h = Math.max(360, rows.length*24 + 40);
    const m = { top:14, right:80, bottom:14, left:160 };
    const svg = d3.select(wrap).append("svg").attr("viewBox", `0 0 ${w} ${h}`);
    const x = d3.scaleLinear().domain([0, d3.max(rows, r => r[state.metric])]).nice().range([m.left, w - m.right]);
    const y = d3.scaleBand().domain(rows.map(r => r.ccaa)).range([m.top, h - m.bottom]).padding(0.18);
    svg.append("g").selectAll("rect").data(rows).join("rect")
      .attr("x", x(0)).attr("y", r => y(r.ccaa)).attr("height", y.bandwidth())
      .attr("width", r => x(r[state.metric]) - x(0))
      .attr("fill", r => r.ccaa === "Canarias" ? "var(--ced-contrast)" : "var(--ced-accent)")
      .attr("opacity", r => r.origen === "proyeccion" ? 0.6 : 1);
    svg.append("g").attr("class","ced-axis").attr("transform", `translate(${m.left},0)`).call(d3.axisLeft(y).tickSize(0));
    svg.append("g").selectAll("text.value").data(rows).join("text")
      .attr("class","value")
      .attr("x", r => x(r[state.metric]) + 6).attr("y", r => y(r.ccaa) + y.bandwidth()/2 + 4)
      .attr("font-size", 11.5).attr("fill","var(--ced-ink)")
      .text(r => d3.format(meta.fmt)(r[state.metric]) + meta.suffix);
  }

  // ====== Render: serie temporal ===========================================
  // Comunidad resaltada en la evolución móvil. Vive fuera de la función
  // porque tiene que sobrevivir a los re-render; no se guarda en la URL
  // porque es una ayuda de lectura, no un estado del análisis.
  let evoSeleccion = "Canarias";

  /* ====== Render móvil: evolución =========================================
     En 375px las diecisiete series son una maraña: sin sitio para
     etiquetas, quedaban diecisiete trazos grises indistinguibles y sólo se
     leía el de Canarias. Aquí se cuenta lo mismo con tres elementos:

     - la banda intercuartílica (p25-p75) de las comunidades, que es dónde
       está la mitad central y ahorra dibujar quince líneas;
     - la mediana autonómica, como referencia;
     - Canarias, siempre trazada, y opcionalmente otra comunidad para
       comparar de tú a tú.

     El eje Y no arranca en cero: con series que se mueven en una banda
     estrecha —esperas, tasas, precios— el cero aplasta la variación y no
     deja ver nada. Como contrapartida, el eje va siempre rotulado con sus
     valores y la banda enseña la dispersión real, que es lo que evita
     leer una pendiente como si fuera un desplome.
     ====================================================================== */
  /* Dominio del eje Y ajustado al recorrido de los valores, con un margen
     proporcional. Si los valores no bajan de cero, el eje tampoco: un
     porcentaje o un precio con ticks negativos es un artefacto del margen,
     no un dato. */
  function adaptiveDomain(values, margen) {
    const lo = d3.min(values), hi = d3.max(values);
    const aire = (hi - lo) * margen || Math.abs(hi * 0.05) || 1;
    return [lo >= 0 ? Math.max(0, lo - aire) : lo - aire, hi + aire];
  }

  function renderEvolutionMobile(wrap, cfg, meta, series, stateLine) {
    const w = wrap.clientWidth || 360;
    const h = 400;
    const m = { top: 26, right: 12, bottom: 34, left: 46 };

    // Cuartiles por periodo, calculados entre comunidades.
    const porPeriodo = Array.from(
      d3.group(series.flatMap(s => s.values.map(v => ({ periodo: v.periodo, val: v[state.metric] }))
        .filter(v => v.val != null)), d => d.periodo),
      ([periodo, vs]) => {
        const orden = vs.map(v => v.val).sort(d3.ascending);
        return {
          periodo,
          q1: d3.quantile(orden, 0.25),
          q3: d3.quantile(orden, 0.75),
          mediana: d3.quantile(orden, 0.5)
        };
      }
    ).sort((a, b) => a.periodo - b.periodo);

    const canarias = series.find(s => s.ccaa === "Canarias");
    // Si la comunidad elegida no existe en esta sección, se vuelve a Canarias.
    if (!series.some(s => s.ccaa === evoSeleccion)) evoSeleccion = "Canarias";
    const elegida = series.find(s => s.ccaa === evoSeleccion);
    const resaltada = elegida || canarias;

    // Dominio del eje Y: sólo lo que se dibuja, con un 8% de aire. Sin
    // .nice() por abajo no habría margen para las etiquetas de datos.
    const dibujado = []
      .concat(porPeriodo.flatMap(p => [p.q1, p.q3, p.mediana]))
      .concat(canarias ? canarias.values.map(v => v[state.metric]) : [])
      .concat(elegida ? elegida.values.map(v => v[state.metric]) : [])
      .filter(v => v != null);

    const svg = d3.select(wrap).append("svg").attr("viewBox", `0 0 ${w} ${h}`);
    const x = d3.scaleLinear().domain(d3.extent(porPeriodo, p => p.periodo)).range([m.left, w - m.right]);
    const y = d3.scaleLinear().domain(adaptiveDomain(dibujado, 0.08)).nice().range([h - m.bottom, m.top]);

    svg.append("g").attr("class", "ced-grid").attr("transform", `translate(${m.left},0)`)
      .call(d3.axisLeft(y).ticks(4).tickSize(-(w - m.left - m.right)).tickFormat(""))
      .call(g => g.select(".domain").remove());

    const xTickFormat = cfg.granularity === "monthly"
      ? (v => { const yr = Math.floor(v); const mo = Math.round((v - yr) * 12) + 1;
                return mo === 1 ? String(yr) : MONTH_NAMES_ES_SHORT[mo - 1]; })

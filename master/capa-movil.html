<!-- ===================================================================
     CAPA MÓVIL · Canarias en Datos
     ===================================================================
     Se pega SIEMPRE ANTES del bloque de canendatos_storytelling_d3.html.
     El orden importa por dos motivos:

     1. El desvío de la geometría tiene que estar puesto antes de que el
        modelo lance su fetch, y el modelo lo lanza nada más ejecutarse.
     2. El script marca <html data-cedm="movil"> de forma síncrona, antes
        del primer pintado. Todas las reglas de abajo cuelgan de ese
        atributo, y eso es lo que les da más especificidad que las del
        modelo pese a ir antes en el documento. Sin el atributo, al tener
        la misma especificidad ganaría el modelo por ir después.

     No toca el modelo: sólo añade CSS y reordena nodos que ya existen. Si
     esta capa no se carga, el modelo se comporta exactamente como hoy.

     Se activa si el ancho es <= 640px —el mismo umbral que el isMobile()
     del modelo, para que layout y render no se desincronicen— o si el
     puntero es grueso, que es lo que de verdad distingue el dedo del
     ratón: hay tablets anchas sin hover y portátiles táctiles.

     El orden en vertical es: área, filtros, gráfico, insights y botones.
     Manda lo que se mira; el filtrado va pegado encima del gráfico, y lo
     que se toca una vez por visita —metodología, descarga— va al final.

     =================================================================== -->

<style>
  /* ---------------------------------------------------------------
     1. OBJETIVOS TÁCTILES
     Los tres selectores y los dos botones miden 38px de alto. El mínimo
     son 44px (WCAG 2.5.5 y el mínimo de facto de iOS).

     La regla va duplicada a propósito, por puntero y por ancho: la
     tablet táctil ancha sólo la cazan (pointer:coarse); el móvil cuyo
     navegador se declara de puntero fino sólo lo caza el ancho.
     --------------------------------------------------------------- */
  @media (pointer: coarse) {
    html[data-cedm="movil"] #ced-canendatos-d3 .ced-btn,
    html[data-cedm="movil"] #ced-canendatos-d3 select {
      min-height: 44px;
      font-size: 16px; /* por debajo de 16px iOS hace zoom al enfocar */
    }
    html[data-cedm="movil"] #ced-canendatos-d3 .ced-section-btn,
    html[data-cedm="movil"] #ced-canendatos-d3 .ced-story-step {
      min-height: 48px;
    }

    /* Sin hover no hay nota emergente que valga. En el mapa-lista el dato
       ya está escrito al lado de cada comunidad, así que no se pierde
       nada. Mismo criterio que en viz-cargos-publicos. */
    html[data-cedm="movil"] #ced-canendatos-d3 .ced-tooltip {
      display: none !important;
    }
  }

  @media (max-width: 640px) {
    html[data-cedm="movil"] #ced-canendatos-d3 .ced-btn,
    html[data-cedm="movil"] #ced-canendatos-d3 select {
      min-height: 44px;
      font-size: 16px;
    }

    /* -------------------------------------------------------------
       2. LA PORTADA ERA TODO CHASIS
       Medido sobre la versión publicada a 375x812: el primer dato caía
       en y=820px —justo debajo del pliegue— y la página entera medía
       2149px. Entre el titular a cuatro líneas, la entradilla a cuatro,
       dos botones a ancho completo y tres selectores apilados, había que
       hacer scroll para ver un solo número.
       ------------------------------------------------------------- */
    html[data-cedm="movil"] #ced-canendatos-d3 {
      padding: 10px 10px 22px;
    }

    /* -------------------------------------------------------------
       2.b CABEZAL
       Tarjeta blanca, con el mismo fondo, borde y radio que las de abajo:
       en vertical, una franja navy a toda anchura pesa más que el dato que
       viene detrás. La identidad la ponen la marca, el titular en Space
       Grotesk y la cifra clave en teal, que es como manda la guía
       destacar un número en su primer uso.

       No se carga Google Fonts: el <link> de tipografías bloquea el
       pintado —está documentado en la interfaz de Transparencia— y en
       móvil eso es lo último que conviene. Se nombran las familias por si
       están instaladas y se cae a la pila del sistema, que es lo que ya
       hace el resto de la pieza.

       Va compacto a propósito: cada píxel que ocupa aquí es uno que le
       falta al gráfico en la primera pantalla.
       ------------------------------------------------------------- */
    html[data-cedm="movil"] .cedm-cabezal {
      margin: 0 0 10px;
      padding: 13px 14px 15px;
      border-radius: 12px;
      background: var(--ced-surface);
      border: 1px solid var(--ced-line);
      color: var(--ced-ink);
    }
    html[data-cedm="movil"] .cedm-marca {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 9px;
    }
    /* El modelo declara `#ced-canendatos-d3 svg { width:100% }` para que
       los gráficos llenen su caja, y la marca, que vive dentro, heredaba
       esa regla y salía del tamaño de media pantalla. */
    html[data-cedm="movil"] .cedm-marca svg {
      width: 22px;
      height: 22px;
      flex: 0 0 22px;
      display: block;
    }
    html[data-cedm="movil"] .cedm-marca span {
      font-family: "Space Grotesk", Inter, ui-sans-serif, system-ui, sans-serif;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .12em;
      color: var(--ced-muted);
      line-height: 1.3;
    }
    html[data-cedm="movil"] .cedm-cabezal h1 {
      margin: 0;
      font-family: "Space Grotesk", Inter, ui-sans-serif, system-ui, sans-serif;
      font-size: clamp(1.28rem, 6.4vw, 1.7rem);
      font-weight: 700;
      line-height: 1.14;
      letter-spacing: -.01em;
      color: var(--ced-ink);
    }
    /* Sobre blanco el teal de marca no sirve para texto: #00C8B4 da 1,9:1
       y el #009E8E de la guía, 3,3:1. AA pide 4,5:1 en texto pequeño, así
       que para las palabras se usa un teal rebajado —5,4:1— y el de marca
       se reserva para el logo, que al ser gráfico le basta con 3:1. */
    html[data-cedm="movil"] .cedm-cabezal h1 em {
      font-style: normal;
      color: #00786C;
    }
    html[data-cedm="movil"] .cedm-cabezal p {
      margin: 7px 0 0;
      font-size: 12.5px;
      line-height: 1.45;
      color: var(--ced-muted);
    }
    html[data-cedm="movil"] .cedm-cabezal p b {
      color: #00786C;
      font-weight: 700;
    }

    /* El carrusel de áreas se sustituye por un desplegable. Con siete
       temáticas, un carrusel obliga a arrastrar a ciegas: no se ve cuántas
       hay ni cuál viene después. El desplegable las enseña todas de golpe
       y lo dibuja el sistema operativo, que es lo que la usuaria ya sabe
       manejar. */
    html[data-cedm="movil"] #ced-canendatos-d3 .ced-sections {
      display: none;
    }
    /* Etiqueta y control en la misma línea, que ahora el cabezal ya dice
       dónde estamos y una altura de rótulo entera se puede ahorrar. */
    html[data-cedm="movil"] .cedm-area {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 10px;
      background: var(--ced-surface);
      border: 1px solid var(--ced-line);
      border-radius: 12px;
      padding: 8px 12px;
    }
    html[data-cedm="movil"] .cedm-area label {
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--ced-muted);
      white-space: nowrap;
    }
    html[data-cedm="movil"] .cedm-area select {
      flex: 1;
      min-width: 0;
      min-height: 44px;
      font-size: 16px;
      font-family: inherit;
      font-weight: 650;
      color: var(--ced-accent-deep);
      background: var(--ced-bg);
      border: 1px solid var(--ced-line);
      border-radius: 9px;
      padding: 0 10px;
    }

    /* La tarjeta del titular no se enseña en vertical. Ocupaba 217px
       —eyebrow, titular a tres líneas y entradilla— para contar algo que
       en ese momento ya está dicho en otros dos sitios: el área la dice el
       desplegable de arriba, y el indicador y el periodo los repite la
       cabecera del panel. Ese hueco se lo queda el cuadro de filtrado.

       Se oculta la <section> entera y no sólo su interior: vaciada seguía
       pintando su propio fondo y su borde, y dejaba una franja gris entre
       el área y los filtros. Ocultarla no estorba al revertido, que
       devuelve cada nodo por la referencia que guardó, no por lo que se
       vea. */
    html[data-cedm="movil"] #ced-canendatos-d3 .ced-header {
      display: none;
    }

    /* -------------------------------------------------------------
       3. EL GRÁFICO PRIMERO, LO DEMÁS DEBAJO
       El script mueve los nodos; aquí sólo se les da forma de tarjeta,
       porque fuera de la cabecera se quedaban sin fondo ni margen.
       ------------------------------------------------------------- */
    html[data-cedm="movil"] #ced-canendatos-d3 .ced-kpi-row[data-cedm-orden] {
      margin: 10px 0 0;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }
    html[data-cedm="movil"] #ced-canendatos-d3 .ced-kpi-label {
      font-size: 11px;
      letter-spacing: .04em;
    }
    html[data-cedm="movil"] #ced-canendatos-d3 .ced-kpi-value {
      font-size: 21px;
    }
    html[data-cedm="movil"] #ced-canendatos-d3 .ced-kpi-note {
      font-size: 11.5px;
    }

    /* -------------------------------------------------------------
       4. EL CUADRO DE FILTRADO, EN EL HUECO DEL TITULAR
       Justo encima del gráfico: se lee antes lo que se está mirando —qué
       indicador, qué año, qué género— y se cambia sin bajar. Y el gráfico
       queda a un palmo del borde superior, que era el objetivo.
       ------------------------------------------------------------- */
    html[data-cedm="movil"] #ced-canendatos-d3 .ced-toolbar[data-cedm-orden] {
      margin: 0 0 10px;
      background: var(--ced-surface);
      border: 1px solid var(--ced-line);
      border-radius: 12px;
      padding: 10px 12px 12px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 10px;
    }
    /* Indicador a todo el ancho, que sus etiquetas son largas. Periodo y
       género caben a media columna. */
    html[data-cedm="movil"] #ced-canendatos-d3 .ced-toolbar .ced-control:first-child {
      grid-column: 1 / -1;
    }
    html[data-cedm="movil"] #ced-canendatos-d3 .ced-control label {
      font-size: 10.5px;
    }

    /* Metodología y descarga, al final: se usan una vez por visita, si
       acaso, y arriba se comían una pantalla que le hace falta al dato.
       En dos columnas, no en dos filas. */
    html[data-cedm="movil"] #ced-canendatos-d3 .ced-actions[data-cedm-orden] {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      width: 100%;
      margin: 10px 0 0;
    }

    /* -------------------------------------------------------------
       5. NAVEGACIÓN PERSISTENTE ABAJO
       Patrón de viz-cargos-publicos: cuando las secciones son largas, la
       navegación vive en una barra fija inferior y las pestañas de
       arriba sobran. Aquí la barra lleva los cuatro capítulos, que es lo
       que se cambia varias veces por visita; el área se elige una vez, al
       entrar, y para eso está el desplegable de arriba.
       ------------------------------------------------------------- */
    html[data-cedm="movil"] #ced-canendatos-d3 .ced-story-nav {
      display: none;
    }

    html[data-cedm="movil"] .cedm-botnav {
      display: flex;
      position: fixed;
      left: 0; right: 0; bottom: 0;
      z-index: 200;
      gap: 4px;
      background: rgba(13, 27, 42, .97);
      border-top: 1px solid rgba(255, 255, 255, .12);
      box-shadow: 0 -6px 20px rgba(13, 27, 42, .30);
      padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
    }
    /* Hueco para que la barra fija no tape el pie de fuentes. El 74px era
       un número a ojo y se quedaba corto en cuanto el pie iba a dos
       líneas o el teléfono tenía barra de gestos alta: la altura real
       depende del safe-area, que sólo conoce el dispositivo. El script
       mide la barra y escribe --cedm-barra; el 74px queda de reserva por
       si el script no llegara a correr. */
    html[data-cedm="movil"] body.cedm-activa {
      padding-bottom: calc(var(--cedm-barra, 74px) + 16px);
    }

    /* -------------------------------------------------------------
       6. PANEL Y PIE
       11px sobre fondo claro es el suelo de lo legible; las notas de
       fuente suben a 12 y ganan interlineado.
       ------------------------------------------------------------- */
    html[data-cedm="movil"] #ced-canendatos-d3 .ced-panel-title { font-size: 15px; }
    html[data-cedm="movil"] #ced-canendatos-d3 .ced-panel-sub   { font-size: 12px; }
    html[data-cedm="movil"] #ced-canendatos-d3 .ced-mlist-name  { font-size: 13.5px; }
    html[data-cedm="movil"] #ced-canendatos-d3 .ced-mlist-value { font-size: 13.5px; }
    html[data-cedm="movil"] #ced-canendatos-d3 .ced-source-strip {
      font-size: 12px;
      line-height: 1.45;
      gap: 4px;
    }
  }

  /* La barra sólo existe en móvil; fuera del media query se esconde para
     que un cambio de orientación a horizontal no la deje colgando. */
  .cedm-botnav { display: none; }
  .cedm-botnav-btn {
    flex: 1 1 0;
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    background: none;
    border: 0;
    border-radius: 11px;
    color: rgba(255, 255, 255, .64);
    font-family: inherit;
    font-weight: 700;
    font-size: 11px;
    padding: 6px 4px;
    min-height: 48px;
    -webkit-tap-highlight-color: transparent;
    transition: color .15s ease, background .15s ease;
  }
  .cedm-botnav-btn .cedm-lb {
    max-width: 100%;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .cedm-botnav-btn .cedm-ic { font-size: 15px; line-height: 1; }
  /* El capítulo activo no se distingue sólo por color: además del fondo
     lleva un filete superior y el texto en blanco. */
  .cedm-botnav-btn.on {
    color: #fff;
    background: rgba(0, 200, 180, .18);
    box-shadow: inset 0 2px 0 #00C8B4;
  }
  .cedm-botnav-btn:focus-visible {
    outline: 2px solid #00C8B4;
    outline-offset: -2px;
  }

  /* ---------------------------------------------------------------
     7. ACCESIBILIDAD VISUAL (en cualquier ancho)
     El modelo no declara foco visible en ningún control: con teclado o
     con navegación por conmutador no hay forma de saber dónde estás.
     --------------------------------------------------------------- */
  #ced-canendatos-d3 :is(button, select, [role="button"]):focus-visible,
  .cedm-area select:focus-visible {
    outline: 2px solid var(--ced-contrast, #00C8B4);
    outline-offset: 2px;
    border-radius: 8px;
  }

  @media (prefers-reduced-motion: reduce) {
    #ced-canendatos-d3 *,
    .cedm-botnav * {
      animation-duration: .001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .001ms !important;
      scroll-behavior: auto !important;
    }
  }

  /* Sólo para lectores de pantalla. */
  .cedm-sr {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }
</style>

<script>
(function () {
  "use strict";

  var mqEstrecho = window.matchMedia("(max-width: 640px)");
  var mqTactil   = window.matchMedia("(pointer: coarse)");

  function aplica() {
    var toca = mqEstrecho.matches || mqTactil.matches;
    document.documentElement.setAttribute("data-cedm", toca ? "movil" : "escritorio");
    return toca;
  }
  // Síncrono y lo primero: si el atributo se pusiera después del primer
  // pintado, la página aparecería un instante con el layout de escritorio.
  aplica();

  /* =================================================================
     A. GEOMETRÍA: 18 MB -> 31 KB
     =================================================================
     El modelo pide a Eurostat NUTS_RG_01M_2021_4326_LEVL_2.geojson y se
     queda con las 19 regiones que casan con /^ES\d{2}$/. Ese fichero son
     18.077.469 bytes SIN comprimir —GISCO no sirve gzip, comprobado con
     curl --compressed— o sea toda Europa a 1:1M para pintar España.

     En móvil ni siquiera se llega a pintar: el modelo sustituye el mapa
     por una lista de comunidades, pero la descarga se hace igual porque
     la antesala de carga espera a la promesa de la geometría. Son 18 MB
     de datos móviles para un mapa que no se dibuja.

     Aquí se desvía a una copia local: las mismas 19 regiones a 1:10M,
     coordenadas redondeadas a cuatro decimales (~11 m, de sobra para un
     mapa de 350px) y sólo las dos propiedades que el modelo lee. 31 KB,
     con las ocho islas de Canarias.

     Si la copia local fallara se deja pasar la petición original: antes
     una descarga cara que un mapa roto.
     ================================================================= */
  var GEO_REMOTA = /gisco-services\.ec\.europa\.eu\/.*NUTS_RG_.*LEVL_2\.geojson/;
  var GEO_LOCAL  = "geo/ccaa-nuts2-10m.geojson";

  if (mqEstrecho.matches && typeof window.fetch === "function") {
    var fetchOriginal = window.fetch.bind(window);
    window.fetch = function (recurso, opciones) {
      var url = typeof recurso === "string" ? recurso : (recurso && recurso.url) || "";
      if (!GEO_REMOTA.test(url)) return fetchOriginal(recurso, opciones);
      return fetchOriginal(GEO_LOCAL, opciones)
        .then(function (r) { return r.ok ? r : fetchOriginal(recurso, opciones); })
        .catch(function () { return fetchOriginal(recurso, opciones); });
    };
  }

  /* =================================================================
     B. REESTRUCTURA DEL CHASIS
     ================================================================= */
  var CAPITULOS = [
    { paso: "context",   ic: "◉", lb: "Situar"    },
    { paso: "evolution", ic: "◔", lb: "Evolución" },
    { paso: "gender",    ic: "◑", lb: "Género"    },
    { paso: "method",    ic: "☰", lb: "Método"    }
  ];

  // Sitio original de cada nodo que se mueve, para poder devolverlo. Se
  // guarda la primera vez y no se vuelve a tocar.
  var casa = {};

  /* =================================================================
     CANARIAS, EN SU PUESTO
     =================================================================
     El modelo saca a Canarias la primera de la lista —"Canarias primero,
     resto descendente" en renderMobileList, y lo mismo en la vista de
     género—. La insignia sigue diciendo el puesto real, pero la primera
     posición se lee como si lo fuera: se ve "Canarias" arriba del todo y
     el ojo concluye que encabeza, aunque ponga 4º. Es una lectura
     sesgada, y en una pieza que compara comunidades eso importa.

     Aquí se devuelve cada fila a su sitio. Canarias se sigue
     distinguiendo, pero por el resalte —borde y barra en naranja—, que es
     lo que hay que usar para destacar sin alterar el orden.
     ================================================================= */
  function ordenaListas(root) {
    // Mapa-lista: el puesto está escrito en la insignia, así que el orden
    // correcto se recupera exactamente, sin releer los datos.
    root.querySelectorAll(".ced-mlist").forEach(function (lista) {
      var filas = Array.prototype.slice.call(lista.children).map(function (f) {
        var ins = f.querySelector(".ced-mlist-rank");
        return { fila: f, n: ins ? parseInt(ins.textContent, 10) : NaN };
      });
      if (!filas.length || filas.some(function (x) { return isNaN(x.n); })) return;
      var ordenado = filas.every(function (x, i) { return i === 0 || filas[i - 1].n <= x.n; });
      if (ordenado) return; // ya está bien: no tocar, o el observador se realimenta
      filas.sort(function (a, b) { return a.n - b.n; });
      filas.forEach(function (x) { lista.appendChild(x.fila); });
    });

    // Vista de género: aquí no hay insignia de puesto, y el criterio del
    // modelo es la brecha absoluta de mayor a menor. Se lee del rótulo de
    // brecha que ya está pintado; si algún rótulo no se deja interpretar,
    // se deja la lista como está antes que reordenarla a medias.
    root.querySelectorAll(".ced-mgender").forEach(function (lista) {
      var filas = Array.prototype.slice.call(lista.children).map(function (f) {
        var r = f.querySelector(".ced-mgender-gap");
        var m = r && r.textContent.replace(",", ".").match(/-?\d+(\.\d+)?/);
        return { fila: f, v: m ? Math.abs(parseFloat(m[0])) : NaN };
      });
      if (!filas.length || filas.some(function (x) { return isNaN(x.v); })) return;
      var ordenado = filas.every(function (x, i) { return i === 0 || filas[i - 1].v >= x.v; });
      if (ordenado) return;
      filas.sort(function (a, b) { return b.v - a.v; });
      filas.forEach(function (x) { lista.appendChild(x.fila); });
    });
  }

  function arranca() {
    var root = document.getElementById("ced-canendatos-d3");
    if (!root || root.dataset.cedmCapa === "puesta") return;
    if (!mqEstrecho.matches) return;
    root.dataset.cedmCapa = "puesta";
    document.body.classList.add("cedm-activa");

    /* --- B.0 Cabezal ----------------------------------------------
       La pieza entra en la web sin presentación: el modelo empieza por el
       carrusel de áreas, y en móvil, quitada la tarjeta del titular, no
       quedaba nada que dijera qué es esto.

       La cifra de indicadores no va escrita a mano: la publica el modelo
       en data-ced-indicadores contando las métricas declaradas, así que
       si mañana se añade un indicador el cabezal se entera solo. Si el
       atributo no estuviera, se omite la frase antes que enseñar un
       número inventado. */
    var cabezal = document.querySelector(".cedm-cabezal");
    if (!cabezal) {
      var nInd  = parseInt(root.dataset.cedIndicadores, 10);
      var nArea = parseInt(root.dataset.cedAreas, 10);
      var areasEnLetra = { 4: "cuatro", 5: "cinco", 6: "seis", 7: "siete", 8: "ocho" };

      cabezal = document.createElement("header");
      cabezal.className = "cedm-cabezal";
      cabezal.innerHTML =
        '<div class="cedm-marca">' +
          '<svg width="22" height="22" viewBox="0 0 40 40" aria-hidden="true">' +
            '<circle cx="20" cy="20" r="18" fill="none" stroke="#009E8E" stroke-width="2.5"/>' +
            '<circle cx="20" cy="20" r="3.4" fill="#009E8E"/>' +
            '<g stroke="#009E8E" stroke-width="2.5">' +
              '<line x1="20" y1="3" x2="20" y2="9"/><line x1="20" y1="31" x2="20" y2="37"/>' +
              '<line x1="3" y1="20" x2="9" y2="20"/><line x1="31" y1="20" x2="37" y2="20"/>' +
            '</g>' +
          '</svg>' +
          '<span>ODESOCAN · Observatorio de<br>Derechos Sociales de Canarias</span>' +
        '</div>' +
        '<h1>Canarias en el <em>Estado</em></h1>' +
        (isNaN(nInd) ? "" :
          '<p>Analiza <b>' + nInd + ' indicadores</b> distribuidos en ' +
          (areasEnLetra[nArea] || nArea) + ' áreas que nos afectan en nuestro día a día, ' +
          'comparando territorios, tiempo y género.</p>');

      var anclaCabezal = root.querySelector("[data-ced-sections]");
      if (anclaCabezal && anclaCabezal.parentNode) {
        anclaCabezal.parentNode.insertBefore(cabezal, anclaCabezal);
      }
    }

    /* --- B.1 El área, en un desplegable ---------------------------
       Delega en las pestañas que el modelo ya pintó, que sólo se crean
       una vez (renderSectionTabs corre en el arranque y nadie las vuelve
       a tocar), así que basta con pulsarlas. */
    var secciones = root.querySelector("[data-ced-sections]");
    var selArea = null;
    if (secciones && !document.querySelector(".cedm-area")) {
      var caja = document.createElement("div");
      caja.className = "cedm-area";
      var et = document.createElement("label");
      et.textContent = "Área de análisis";
      et.setAttribute("for", "cedm-area-sel");
      selArea = document.createElement("select");
      selArea.id = "cedm-area-sel";

      secciones.querySelectorAll("[data-ced-section-btn]").forEach(function (btn) {
        var o = document.createElement("option");
        o.value = btn.dataset.cedSectionBtn;
        var nombre = btn.querySelector("strong") ? btn.querySelector("strong").textContent : o.value;
        // Las áreas no disponibles se listan igualmente, en gris: que no
        // aparezcan haría pensar que no existen.
        o.textContent = btn.dataset.coming === "true" ? nombre + " · próximamente" : nombre;
        o.disabled = btn.dataset.coming === "true";
        if (btn.classList.contains("is-active")) o.selected = true;
        selArea.appendChild(o);
      });

      selArea.addEventListener("change", function () {
        var destino = secciones.querySelector('[data-ced-section-btn="' + selArea.value + '"]');
        if (destino) destino.click();
      });

      caja.appendChild(et);
      caja.appendChild(selArea);
      secciones.parentNode.insertBefore(caja, secciones);
    }

    /* --- B.2 El orden: gráfico, filtros, insights, botones --------
       Se mueven los nodos, no su contenido: el modelo sigue escribiendo
       dentro de cada uno en cada render, así que el orden sobrevive a los
       cambios de indicador, de periodo y de área. */
    var panel    = root.querySelector(".ced-panel");
    var barraFil = root.querySelector(".ced-toolbar");
    var kpis     = root.querySelector("[data-ced-kpis]");
    var acciones = root.querySelector(".ced-actions");

    if (panel && panel.parentNode) {
      var apunta = function (clave, nodo) {
        if (!nodo) return null;
        if (!casa[clave]) casa[clave] = { padre: nodo.parentNode, siguiente: nodo.nextSibling };
        nodo.dataset.cedmOrden = "si";
        return nodo;
      };

      // Los filtros, delante del gráfico, en el hueco que deja el titular.
      if (apunta("filtros", barraFil)) panel.parentNode.insertBefore(barraFil, panel);

      // Insights y botones, detrás. El orden del array ES el orden en
      // pantalla: cada appendChild los deja al final del contenedor.
      [["insights", kpis], ["botones", acciones]].forEach(function (par) {
        if (apunta(par[0], par[1])) panel.parentNode.appendChild(par[1]);
      });
    }

    /* --- B.3 Barra inferior fija con los cuatro capítulos ----------
       Delega en los botones que ya existen en .ced-story-nav, ocultos
       por CSS: el estado, el render y el historial siguen siendo los del
       modelo. La barra sólo refleja y dispara. */
    var pasos = root.querySelectorAll("[data-ced-step]");
    if (!pasos.length) return;

    // Se reutiliza si ya existe: al girar el móvil arriba y abajo, arranca()
    // puede correr varias veces y no queremos una pila de rótulos ocultos.
    var aviso = document.querySelector(".cedm-sr");
    if (!aviso) {
      aviso = document.createElement("p");
      aviso.className = "cedm-sr";
      aviso.setAttribute("role", "status");
      aviso.setAttribute("aria-live", "polite");
      document.body.appendChild(aviso);
    }

    var barra = document.createElement("nav");
    barra.className = "cedm-botnav";
    barra.setAttribute("aria-label", "Capítulos");

    CAPITULOS.forEach(function (cap) {
      var origen = root.querySelector('[data-ced-step="' + cap.paso + '"]');
      if (!origen) return;
      var b = document.createElement("button");
      b.type = "button";
      b.className = "cedm-botnav-btn";
      b.dataset.cedmPaso = cap.paso;
      b.innerHTML = '<span class="cedm-ic" aria-hidden="true">' + cap.ic + "</span>" +
                    '<span class="cedm-lb">' + cap.lb + "</span>";
      b.addEventListener("click", function () {
        origen.click();
        aviso.textContent = "Capítulo: " + cap.lb;
        var panelAhora = root.querySelector(".ced-panel");
        if (panelAhora) panelAhora.scrollIntoView({ block: "start", behavior: "smooth" });
      });
      barra.appendChild(b);
    });
    document.body.appendChild(barra);

    /* La altura real de la barra sólo se sabe una vez pintada: al padding
       vertical se le suma el safe-area, que cambia de un teléfono a otro.
       Se mide y se publica en una variable CSS. */
    var mide = function () {
      document.documentElement.style.setProperty(
        "--cedm-barra", Math.round(barra.getBoundingClientRect().height) + "px");
    };
    mide();
    if (window.ResizeObserver) new ResizeObserver(mide).observe(barra);

    /* El modelo marca el capítulo activo con .is-active sobre el botón
       original. Se observa esa clase en lugar de duplicar el estado, que
       es lo que se desincronizaría al navegar con el historial. */
    function sincroniza() {
      barra.querySelectorAll(".cedm-botnav-btn").forEach(function (b) {
        var origen = root.querySelector('[data-ced-step="' + b.dataset.cedmPaso + '"]');
        var activo = !!(origen && origen.classList.contains("is-active"));
        b.classList.toggle("on", activo);
        b.setAttribute("aria-current", activo ? "true" : "false");
      });
    }
    sincroniza();
    var obs = new MutationObserver(sincroniza);
    pasos.forEach(function (p) {
      obs.observe(p, { attributes: true, attributeFilter: ["class"] });
    });

    /* Cada render del modelo vuelve a pintar la lista con Canarias
       delante, así que hay que reordenar después de cada uno. Se vigila el
       contenedor del gráfico, que es donde escribe. El seguro contra la
       realimentación es doble: la bandera, y que ordenaListas() no toca
       nada si la lista ya está en orden. */
    var lienzo = root.querySelector("[data-ced-chart]");
    if (lienzo) {
      ordenaListas(root);
      var reordenando = false;
      new MutationObserver(function () {
        if (reordenando) return;
        reordenando = true;
        ordenaListas(root);
        reordenando = false;
      }).observe(lienzo, { childList: true, subtree: true });
    }

    /* Mismo criterio para el desplegable de área: el modelo marca la
       pestaña activa en switchSection(), y ahí entra también lo que
       restaura del estado guardado al cargar. Si el desplegable no
       escuchara eso, se quedaría enseñando un área que ya no es la que se
       está viendo. */
    if (selArea) {
      var obsArea = new MutationObserver(function () {
        var activa = secciones.querySelector(".ced-section-btn.is-active");
        if (activa && activa.dataset.cedSectionBtn !== selArea.value) {
          selArea.value = activa.dataset.cedSectionBtn;
        }
      });
      secciones.querySelectorAll("[data-ced-section-btn]").forEach(function (b) {
        obsArea.observe(b, { attributes: true, attributeFilter: ["class"] });
      });
    }
  }

  /* Al ensanchar —girar el teléfono, un plegable que se abre, una ventana
     que se agranda— hay que deshacer lo que se movió. El CSS deja de
     aplicarse solo, porque cuelga de media queries, pero los nodos
     movidos se quedarían donde los pusimos: el resultado sería el layout
     de escritorio con los filtros y los botones al final. */
  function revierte() {
    var root = document.getElementById("ced-canendatos-d3");
    if (!root || root.dataset.cedmCapa !== "puesta") return;
    delete root.dataset.cedmCapa;
    document.body.classList.remove("cedm-activa");

    // Cada nodo movido vuelve a su sitio exacto, que se guardó al moverlo.
    [["filtros", ".ced-toolbar"], ["insights", "[data-ced-kpis]"], ["botones", ".ced-actions"]]
      .forEach(function (par) {
        var sitio = casa[par[0]];
        var nodo  = root.querySelector(par[1]);
        if (!nodo || !sitio || !sitio.padre) return;
        delete nodo.dataset.cedmOrden;
        sitio.padre.insertBefore(nodo, sitio.siguiente);
      });

    var area = document.querySelector(".cedm-area");
    if (area) area.remove();

    var cabezal = document.querySelector(".cedm-cabezal");
    if (cabezal) cabezal.remove();

    var barra = document.querySelector(".cedm-botnav");
    if (barra) barra.remove();
  }

  /* Girar el teléfono o estrechar la ventana tienen que llevar al mismo
     sitio que entrar ya en móvil.

     El reparto de trabajo va por ANCHO, no por el atributo: en una tablet
     táctil ancha aplica() da "movil" —porque hay reglas de puntero que sí
     valen ahí— pero el chasis tiene que ser el de escritorio. Mezclar las
     dos condiciones dejaba el DOM a medio revertir. */
  function alCambiar() {
    aplica();
    if (mqEstrecho.matches) arranca(); else revierte();

    /* El modelo no escucha el resize: dibuja al cambiar de escena o de
       filtro y se queda así. Al cruzar el umbral hay que pedirle que
       repinte, o el mapa de escritorio se queda de lista y al revés. Se
       hace pulsando el capítulo que ya está activo, que es su propio
       camino de repintado. */
    var activo = document.querySelector("#ced-canendatos-d3 [data-ced-step].is-active");
    if (activo) activo.click();
  }

  /* Se escuchan las dos cosas a propósito. El evento de matchMedia es el
     correcto, pero no todos los motores lo emiten al cambiar el viewport
     por emulación —comprobado aquí mismo: la consulta pasaba a false y el
     change no llegaba—, así que el resize hace de red. La guarda de estado
     evita que la doble escucha ejecute el trabajo dos veces. */
  var estadoUltimo = mqEstrecho.matches; // el ancho, que es lo que reparte el trabajo
  function siCambia() {
    var ahora = mqEstrecho.matches;
    if (ahora === estadoUltimo) return;
    estadoUltimo = ahora;
    alCambiar();
  }
  if (mqEstrecho.addEventListener) {
    mqEstrecho.addEventListener("change", siCambia);
    mqTactil.addEventListener("change", siCambia);
  }
  var temporizador = null;
  window.addEventListener("resize", function () {
    clearTimeout(temporizador);
    temporizador = setTimeout(siCambia, 180);
  });

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", arranca);
  } else {
    arranca();
  }
})();
</script>

    # Metodologico tablas 4/14. Antes cajon de sastre: inclusion social
    # generica, infancia/familia, cooperacion al desarrollo, deporte, cultura,
    # patrimonio, idioma. Ver logs/progreso.md.
    # Retirados 23.2315 (Proteccion a la familia, 194 M), 23.2317 (Atencion a la infancia,
    # 46 M), 23.2310 (Programacion general, 20 M), 23.2316 (Reinsercion social, 12 M),
    # 23.2331 (Direccion y servicios, 10 M), 23.2325 (Memoria y convivencia, 8 M) y sus
    # keywords genericos ('proteccion a la familia', 'servicios sociales', 'reinsercion
    # social', 'memoria y convivencia', etc.): eran el 98% del concepto, servicios
    # sociales generales sin relacion con diversidad. Se queda 23.2319 'Integracion de los
    # inmigrantes' (6-7 M/anio).
    codigos:
    - '23.2319'
    keywords:

  diversidad:
    # REDEFINIDO 2026-07-27 — Diversidad (LGTBI, migraciones, etnias), per Cuaderno
    # Metodologico tablas 4/14. Antes cajon de sastre: inclusion social
    # generica, infancia/familia, cooperacion al desarrollo, deporte, cultura,
    # patrimonio, idioma. Ver logs/progreso.md.
    # Retirado 231I 'Fomento de la Inclusion Social' (102 M): inclusion generica. Retirado
    # el keyword generico 'diversidad' (capturaba 456E 'Biodiversidad', 14 M, por
    # substring literal — el matcher Python no usa frontera de palabra). Se quedan 232C
    # 'Planificacion y Promocion de la Diversidad' (explicito) y 231P 'Canarios en el
    # exterior' (emigracion, mismo criterio que el 313B de Asturias).
    codigos:
    - '232C'
    - '313B'
    - '234'
    - '266'
    - '231P'
    keywords:
    - 'lgtbi'
    - 'lgbti'

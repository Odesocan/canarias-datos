    # patrimonio, idioma. Ver logs/progreso.md.
    # Retirados los keywords 'infancia'/'familia'/'convivencia': capturaban 19017 'D.G.
    # Infancia, Familia y Fomento de la Natalidad' (206 M) y 19001 'S.G.T.
    # Familia,Juventud y Asuntos Sociales' (66 M) — el 100% de diversidad en Madrid era
    # esto, ningun codigo real. Anadido codigo explicito 19015 'D.G. de Inmigracion' (solo

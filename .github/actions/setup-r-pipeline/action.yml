name: "Setup R pipeline"
description: "R + dependencias de sistema + paquetes núcleo comunes a todas las áreas de Canarias en Datos"

# Uso desde un workflow de área (requiere actions/checkout previo, porque es una
# composite action local):
#
#   - uses: ./.github/actions/setup-r-pipeline
#     with:
#       extra-packages: "forecast prophet ranger xgboost"
#
# El núcleo son los paquetes que las áreas comparten (E/S de datos, manipulación
# y conexión a Postgres). Cada área añade en `extra-packages` solo lo que le
# sobra sobre ese núcleo: modelado (forecast, prophet, ranger, xgboost),
# clientes de fuente (ineapir, rvest, httr2) o utilidades propias.

inputs:
  extra-packages:
    description: "Paquetes R adicionales, separados por espacios o saltos de línea (p. ej. 'forecast prophet ranger')"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - uses: r-lib/actions/setup-r@v2
      with:
        use-public-rspm: true

    - name: Dependencias de sistema
      shell: bash
      run: |
        sudo apt-get update
        # libuv1-dev es la red de seguridad para 'fs': si algún paquete cae a
        # compilación desde fuente (no hay binario para esa versión), 'fs' pide
        # libuv y sin ella arrastra a sass, bslib, rmarkdown, htmlwidgets,
        # dygraphs y prophet.
        sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev libpq-dev libuv1-dev

    - name: Paquetes R (núcleo + extras del área)
      shell: bash
      env:
        # Vía variable de entorno, no interpolado dentro del código R: evita que
        # el contenido del input rompa el entrecomillado o se inyecte como código.
        CED_EXTRA_PACKAGES: ${{ inputs.extra-packages }}
      run: |
        Rscript -e '
          core <- c(
            "DBI", "RPostgres", "dplyr", "glue", "purrr", "readr", "readxl",
            "stringr", "tibble", "tidyr", "lubridate", "writexl"
          )
          extra <- strsplit(trimws(Sys.getenv("CED_EXTRA_PACKAGES")), "[[:space:]]+")[[1]]
          extra <- extra[nzchar(extra)]
          pkgs  <- unique(c(core, extra))

          # NO fijar repos = "https://cloud.r-project.org" aquí. setup-r con
          # use-public-rspm: true ya deja configurado el Posit Package Manager
          # (.../cran/__linux__/noble/latest), que sirve BINARIOS para Ubuntu.
          # Pasar CRAN explícitamente lo anulaba y forzaba compilar todo el árbol
          # desde fuente: 16 min y, sobre todo, frágil — fs no compila sin libuv
          # y su fallo arrastraba hasta prophet.
          repos <- getOption("repos")
          if (is.null(repos) || !length(repos) || !nzchar(repos[[1]]) ||
              identical(unname(repos[[1]]), "@CRAN@")) {
            repos <- c(CRAN = "https://cloud.r-project.org")
          }
          message("Repositorio: ", paste(repos, collapse = ", "))
          message("Instalando ", length(pkgs), " paquetes: ", paste(pkgs, collapse = ", "))

          install.packages(pkgs, repos = repos, Ncpus = max(1L, parallel::detectCores()))
          faltan <- pkgs[!pkgs %in% rownames(installed.packages())]
          if (length(faltan)) stop("No se instalaron: ", paste(faltan, collapse = ", "))
        '

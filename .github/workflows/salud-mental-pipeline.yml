name: Salud Mental Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"

jobs:
  salud-mental:
    runs-on: ubuntu-latest
    # El paso `carga` escribe en la Supabase de producción. Declarar el entorno
    # permite exigir revisor en GitHub antes de que el cron escriba sin supervisión
    # (§4.2). Sin reglas de protección configuradas, no altera la ejecución.
    environment: production

    env:
      # Token del API del INCLASNS. La extracción aborta sin él
      # (sns_api_token() en R/pipeline_utils.R).
      SNS_API_TOKEN: ${{ secrets.SNS_API_TOKEN }}
      SUPABASE_HOST: ${{ secrets.SUPABASE_HOST }}
      SUPABASE_PORT: ${{ secrets.SUPABASE_PORT }}
      SUPABASE_DBNAME: ${{ secrets.SUPABASE_DBNAME }}
      SUPABASE_USER: ${{ secrets.SUPABASE_USER }}
      SUPABASE_PASS: ${{ secrets.SUPABASE_PASS }}
      SUPABASE_SCHEMA: ${{ secrets.SUPABASE_SCHEMA }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Gate de secretos (§ estrategia anti-fallos): para el job en segundos si
      # falta un valor, en vez de descubrirlo tras instalar R.
      - uses: ./.github/actions/check-secrets
        with:
          required: "SNS_API_TOKEN"
          contexto: ".Renviron del area (SNS_API_TOKEN del API del INCLASNS)"

      - name: Setup R
        uses: ./.github/actions/setup-r-pipeline
        with:
          # ineapir + httr/httr2/jsonlite: clientes de las APIs de INCLASNS e INE,
          # declarados en require_packages() de R/pipeline_utils.R.
          # forecast/prophet/ranger/xgboost: la competición de algoritmos de
          # 3_modelado. El workflow original solo instalaba prophet, así que el
          # pipeline nunca habría llegado a completarse en CI.
          extra-packages: "ineapir httr httr2 jsonlite forecast prophet ranger xgboost"

      - name: Run pipeline
        run: |
          WITH_DB=false
          if [ -n "${SUPABASE_HOST}" ] && [ -n "${SUPABASE_USER}" ] && [ -n "${SUPABASE_PASS}" ]; then
            WITH_DB=true
          fi
          Rscript "Salud mental/00_maestro.R" --steps=extraccion,transformacion,modelado,carga --with-db="${WITH_DB}"

      - name: Upload outputs
        uses: actions/upload-artifact@v4
        with:
          name: salud-mental-outputs
          path: |
            Salud mental/2_transformacion/ced_saludmental.rds
            Salud mental/3_modelado/ced_saludmental.rds
            Salud mental/4_carga/ced_saludmental.csv
            Salud mental/4_carga/ced_saludmental.xlsx

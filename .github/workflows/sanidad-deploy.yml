name: sanidad-deploy

# El único workflow de Sanidad que escribe en la Supabase de producción (§4.2),
# y el único que pasa --with-db.
#
# La carga de Sanidad usa TRUNCATE + append en lugar de DROP + CREATE, así que
# preserva estructura, RLS, políticas y grants creados por esquema_sanidad.sql
# (Sanidad/4_carga/carga.R). No necesita el arreglo de RLS que sí requirieron
# Salud mental y Vivienda.

on:
  push:
    branches: [main]
    paths:
      - "Sanidad/4_carga/**"
      - "Sanidad/00_maestro.R"
      - ".github/workflows/sanidad-deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production

    env:
      # Token del API del INCLASNS. La extracción aborta sin él
      # (sns_api_token() en R/pipeline_utils.R).
      SNS_API_TOKEN: ${{ secrets.SNS_API_TOKEN }}
      SUPABASE_HOST: ${{ secrets.SUPABASE_HOST }}
      SUPABASE_PORT: ${{ secrets.SUPABASE_PORT }}
      SUPABASE_DBNAME: ${{ secrets.SUPABASE_DBNAME }}
      SUPABASE_USER: ${{ secrets.SUPABASE_USER }}
      SUPABASE_PASS: ${{ secrets.SUPABASE_PASS }}
      # El esquema NO se pasa desde aquí a propósito. No es un secreto, y sobre
      # todo no es el mismo para todas las áreas: Dependencia escribe en 'saad'
      # y el resto en 'canendatos'. Un único secreto de repositorio no puede
      # servir a ambas, y el fallo sería silencioso — los datos acabarían en el
      # esquema equivocado sin que nada diera error. Cada área ya lleva el suyo
      # como valor por defecto en su código, que es la fuente autoritativa:
      #   Sanidad/R/pipeline_utils.R -> 'canendatos'
      # Al no definir la variable aquí, ese valor por defecto es el que manda.

    steps:
      - uses: actions/checkout@v4

      # Gate de secretos (§ estrategia anti-fallos): para el job en segundos si
      # falta un valor, en vez de descubrirlo tras instalar R.
      - uses: ./.github/actions/check-secrets
        with:
          required: "SNS_API_TOKEN SUPABASE_HOST SUPABASE_USER SUPABASE_PASS"
          contexto: ".Renviron del area (SNS_API_TOKEN del API del INCLASNS) + credenciales de la Supabase de produccion del Observatorio"

      - uses: ./.github/actions/setup-r-pipeline
        with:
          extra-packages: "forecast httr httr2 jsonlite"

      - name: Pipeline completo con carga a Supabase
        working-directory: Sanidad
        run: Rscript 00_maestro.R --steps=extraccion,transformacion,modelado,carga --with-db

      - name: Subir salidas de la carga
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanidad-deploy
          path: |
            Sanidad/3_modelado/qa/**
            Sanidad/4_carga/global_sanidad.csv
            Sanidad/4_carga/gen_sanidad.csv
          if-no-files-found: warn

name: Vivienda Pipeline

on:
  workflow_dispatch:
    inputs:
      escribir_produccion:
        description: "Escribir el resultado en la Supabase de producción"
        type: boolean
        default: false
  schedule:
    # GitHub Actions usa UTC: 05:00 UTC = 05:00 en Canarias en invierno y 06:00 en verano.
    # Se ejecuta el día 5 de cada mes para dar margen a la publicación mensual de Idealista.
    - cron: "0 5 5 * *"

jobs:
  vivienda:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    # El paso `carga` escribe en la Supabase de producción. Declarar el entorno
    # permite exigir revisor en GitHub antes de que el cron escriba sin supervisión
    # (§4.2). Sin reglas de protección configuradas, no altera la ejecución.
    environment: production

    env:
      # Ver el bloque 'case' del paso que ejecuta el pipeline.
      CED_INPUT_ESCRIBIR: ${{ inputs.escribir_produccion }}
      CED_CRON_ESCRIBE: ${{ vars.CED_CRON_ESCRIBE }}
      CED_DB_HOST: ${{ secrets.SUPABASE_HOST }}
      CED_DB_PORT: ${{ secrets.SUPABASE_PORT }}
      CED_DB_NAME: ${{ secrets.SUPABASE_DBNAME }}
      CED_DB_USER: ${{ secrets.SUPABASE_USER }}
      CED_DB_PASSWORD: ${{ secrets.SUPABASE_PASS }}
      # El esquema NO se pasa desde aquí a propósito. No es un secreto, y sobre
      # todo no es el mismo para todas las áreas: Dependencia escribe en 'saad'
      # y el resto en 'canendatos'. Un único secreto de repositorio no puede
      # servir a ambas, y el fallo sería silencioso — los datos acabarían en el
      # esquema equivocado sin que nada diera error. Cada área ya lleva el suyo
      # como valor por defecto en su código, que es la fuente autoritativa:
      #   Vivienda/R/pipeline_utils.R -> 'canendatos'
      # Al no definir la variable aquí, ese valor por defecto es el que manda.
      # CED_PYTHON_BIN se fija en el paso que ejecuta el pipeline, con ruta
      # absoluta: aquí aún no existe el Python que instala setup-python.
      CED_PROJECTION_TARGET_YEAR: "2026"
      CED_MODEL_VALIDATION_YEARS: "3"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: ./.github/actions/setup-python-pipeline
        with:
          # NO usar 3.12, la misma versión que trae Ubuntu 24.04. El scraper se
          # lanza desde R, y Rscript antepone las rutas de librerías del sistema
          # a LD_LIBRARY_PATH: el Python de setup-python cargaba entonces la
          # libpython3.12 de Ubuntu, buscaba paquetes en las rutas de Debian y
          # no veía lo instalado con pip (cron del 2026-09-05: "No module named
          # 'nodriver'"). Con otra versión menor no hay libpython del sistema que
          # pueda suplantar a la suya. Presupuestos hace lo mismo con 3.11.
          python-version: "3.11"
          requirements: "Vivienda/fuentes/scrapings/alquiler_historico_ccaa/requirements.txt"
          # El scraper abre Chrome con ventana (headless=False, menos detectable)
          # y el runner no tiene pantalla: se la da xvfb-run.
          system-deps: "xvfb"

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Setup R
        uses: ./.github/actions/setup-r-pipeline
        with:
          extra-packages: "forecast ineapir janitor prophet ranger xgboost"

      - name: Run Vivienda pipeline
        run: |
          # La carga a producción es una DECISIÓN EXPLÍCITA, nunca un efecto
          # colateral de que existan credenciales. Antes bastaba con que los
          # secretos estuvieran dados de alta para que el cron empezara a
          # escribir en producción sin que nadie lo hubiera pedido.
          #
          #   Ejecución manual -> lo decide el input del formulario.
          #   Cron             -> lo decide la variable de repositorio
          #                       CED_CRON_ESCRIBE (Settings -> Variables).
          #                       Si no existe, el cron NO escribe: valida.
          case "${GITHUB_EVENT_NAME}" in
            workflow_dispatch) SOLICITADO="${CED_INPUT_ESCRIBIR:-false}" ;;
            *)                 SOLICITADO="${CED_CRON_ESCRIBE:-false}" ;;
          esac

          WITH_DB=false
          if [ "${SOLICITADO}" = "true" ]; then
            if [ -z "${CED_DB_HOST}" ] || [ -z "${CED_DB_USER}" ] || [ -z "${CED_DB_PASSWORD}" ] || [ -z "${CED_DB_NAME}" ]; then
              echo "::error::Se ha pedido escribir en producción, pero faltan credenciales de base de datos. No se ejecuta para no dejar la carga a medias."
              exit 1
            fi
            WITH_DB=true
          fi
          echo "Evento: ${GITHUB_EVENT_NAME} · carga a producción: ${WITH_DB}"

          # Ruta absoluta al Python de setup-python: así R no tiene que resolver
          # "python3" y no depende de cómo quede el PATH dentro de Rscript.
          export CED_PYTHON_BIN="${pythonLocation}/bin/python3"
          "${CED_PYTHON_BIN}" -c 'import sys, nodriver; print("Python del scraper:", sys.executable, sys.version.split()[0])'

          # Pantalla virtual para Chrome. El tamaño cubre el mayor viewport que
          # sortea el scraper (2560x1440, extract/browser.py); con la pantalla
          # por defecto de xvfb-run (640x480) la ventana no cabría y la
          # resolución delataría al navegador.
          xvfb-run --auto-servernum --server-args="-screen 0 2560x1440x24" \
            Rscript "Vivienda/00_maestro.R" --steps=scraping,extraccion,transformacion,modelado,carga --run-scraping=true --with-db="${WITH_DB}"

      - name: Upload raw Idealista data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vivienda-idealista-raw
          path: |
            Vivienda/fuentes/raw/idealista/*.csv
            Vivienda/fuentes/scrapings/alquiler_historico_ccaa/data/processed/*.csv
            Vivienda/fuentes/scrapings/alquiler_historico_ccaa/data/raw/*.json
            Vivienda/fuentes/scrapings/alquiler_historico_ccaa/data/logs/*.log
          if-no-files-found: ignore

      - name: Upload Vivienda outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vivienda-outputs
          path: |
            Vivienda/1_extraccion/*.rds
            Vivienda/2_transformacion/*.rds
            Vivienda/3_modelado/*.rds
            Vivienda/3_modelado/seleccion_algoritmo_proyeccion_*.csv
            Vivienda/4_carga/ced_vivienda_global.csv
            Vivienda/4_carga/ced_vivienda_global.xlsx
            Vivienda/4_carga/ced_vivienda_gen.csv
            Vivienda/4_carga/ced_vivienda_gen.xlsx
          if-no-files-found: ignore

name: educacion-deploy

# El único workflow de Educación que escribe en la Supabase de producción (§4.2).
# `environment: production` permite exigir revisor en GitHub antes de que se
# escriba nada. Sin reglas de protección configuradas, no altera la ejecución.

on:
  push:
    branches: [main]
    paths:
      - "Educación/4_carga/**"
      - ".github/workflows/educacion-deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production

    env:
      # 4_carga/config_carga.py lee exactamente estos nombres.
      SUPABASE_HOST: ${{ secrets.SUPABASE_HOST }}
      SUPABASE_PORT: ${{ secrets.SUPABASE_PORT }}
      SUPABASE_DBNAME: ${{ secrets.SUPABASE_DBNAME }}
      SUPABASE_USER: ${{ secrets.SUPABASE_USER }}
      SUPABASE_PASS: ${{ secrets.SUPABASE_PASS }}
      SUPABASE_SCHEMA: ${{ secrets.SUPABASE_SCHEMA }}

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-python-pipeline
        with:
          python-version: "3.12"
          requirements: "Educación/requirements.txt"

      - name: Extracción + QA
        working-directory: "Educación/1_extraccion"
        run: python main.py --qa

      - name: Transformación + QA
        working-directory: "Educación/2_transformacion"
        run: python transformacion.py --qa

      - name: Modelado + QA
        working-directory: "Educación/3_modelado"
        run: python modelado.py --qa

      - name: Carga a Supabase
        working-directory: "Educación/4_carga"
        run: python carga.py --with-db --qa

      - name: Subir salidas de la carga
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: educacion-deploy
          path: |
            Educación/4_carga/data/**
            Educación/4_carga/reports/**
          if-no-files-found: warn

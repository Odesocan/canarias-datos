name: presupuestos-deploy

# SOLO EJECUCIÓN MANUAL MIENTRAS DURE LA CUARENTENA.
#
# El área de Presupuestos está en cuarentena hasta resolver la asignación de
# programas presupuestarios a conceptos, así que su carga no debe salir sola a
# producción. El disparador por push queda retirado a propósito; con él, un
# cambio en Presupuestos/4_carga que llegara a main cargaría en Supabase datos
# de un área que todavía no damos por buena.
#
# Es la misma decisión que ya aplicamos en las otras dos superficies: séptima
# pestaña desactivada en master/canendatos_storytelling_d3.html y ready: false
# en el MANIFEST de canarias-en-datos-web/index.html.
#
# AL LEVANTAR LA CUARENTENA, restaurar:
#
#   on:
#     push:
#       branches: [main]
#       paths:
#         - "Presupuestos/4_carga/**"
#         - "Presupuestos/db/**"
#         - "Presupuestos/00_maestro.R"
#     workflow_dispatch:

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      SUPABASE_HOST: ${{ secrets.SUPABASE_HOST }}
      SUPABASE_PORT: ${{ secrets.SUPABASE_PORT }}
      SUPABASE_DBNAME: ${{ secrets.SUPABASE_DBNAME }}
      SUPABASE_USER: ${{ secrets.SUPABASE_USER }}
      SUPABASE_PASS: ${{ secrets.SUPABASE_PASS }}
      # El esquema NO se pasa desde aquí a propósito. No es un secreto, y sobre
      # todo no es el mismo para todas las áreas: Dependencia escribe en 'saad'
      # y el resto en 'canendatos'. Un único secreto de repositorio no puede
      # servir a ambas, y el fallo sería silencioso — los datos acabarían en el
      # esquema equivocado sin que nada diera error. Cada área ya lleva el suyo
      # como valor por defecto en su código, que es la fuente autoritativa:
      #   Presupuestos/R/pipeline_utils.R -> 'canendatos'
      # Al no definir la variable aquí, ese valor por defecto es el que manda.

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with: { r-version: "4.4" }

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: Presupuestos
          extra-packages: |
            glue here yaml httr fs digest dplyr tidyr tibble readr readxl
            jsonlite stringi stringdist purrr writexl httr2 DBI RPostgres

      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: Python deps
        run: |
          sudo apt-get update && sudo apt-get install -y ghostscript python3-tk
          pip install pdfplumber "camelot-py[base]" pandas pyarrow

      - name: Run pipeline completo
        working-directory: Presupuestos
        run: Rscript 00_maestro.R --steps=extraccion,transformacion,modelado,carga --with-db=true

      - name: Purge CDN cache (canariasendatos.es)
        if: success()
        run: |
          curl --fail -X POST "https://api.canariasendatos.es/cache/purge" \
               -H "Authorization: Bearer ${{ secrets.CDN_TOKEN }}" \
               -d '{"paths":["/presupuestos/*"]}'

name: Dependencia Pipeline

# El IMSERSO publica las estadisticas SAAD entre 6 y 8 semanas despues del
# cierre de mes. Programamos la ejecucion mensual a primera hora del dia 5
# del mes (cuaderno v2 §12), y dejamos workflow_dispatch para reruns puntuales.
on:
  workflow_dispatch:
    inputs:
      escribir_produccion:
        description: "Escribir el resultado en la Supabase de producción"
        type: boolean
        default: false
  schedule:
    - cron: "0 5 5 * *"

jobs:
  dependencia:
    runs-on: ubuntu-latest
    # El paso `carga` escribe en la Supabase de producción. Declarar el entorno
    # permite exigir revisor en GitHub antes de que el cron escriba sin supervisión
    # (§4.2). Sin reglas de protección configuradas, no altera la ejecución.
    environment: production

    env:
      # Ver el bloque 'case' del paso que ejecuta el pipeline.
      CED_INPUT_ESCRIBIR: ${{ inputs.escribir_produccion }}
      CED_CRON_ESCRIBE: ${{ vars.CED_CRON_ESCRIBE }}
      SUPABASE_HOST: ${{ secrets.SUPABASE_HOST }}
      SUPABASE_PORT: ${{ secrets.SUPABASE_PORT }}
      SUPABASE_DBNAME: ${{ secrets.SUPABASE_DBNAME }}
      SUPABASE_USER: ${{ secrets.SUPABASE_USER }}
      SUPABASE_PASS: ${{ secrets.SUPABASE_PASS }}
      # El esquema NO se pasa desde aquí a propósito. No es un secreto, y sobre
      # todo no es el mismo para todas las áreas: Dependencia escribe en 'saad'
      # y el resto en 'canendatos'. Un único secreto de repositorio no puede
      # servir a ambas, y el fallo sería silencioso — los datos acabarían en el
      # esquema equivocado sin que nada diera error. Cada área ya lleva el suyo
      # como valor por defecto en su código, que es la fuente autoritativa:
      #   Dependencia/utils/pipeline_utils.R -> 'saad'
      # Al no definir la variable aquí, ese valor por defecto es el que manda.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup R
        uses: ./.github/actions/setup-r-pipeline
        with:
          extra-packages: >-
            stringi stringdist rvest httr2 xml2 fs digest janitor
            forecast prophet ranger xgboost

      - name: Run pipeline
        run: |
          # La carga a producción es una DECISIÓN EXPLÍCITA, nunca un efecto
          # colateral de que existan credenciales. Antes bastaba con que los
          # secretos estuvieran dados de alta para que el cron empezara a
          # escribir en producción sin que nadie lo hubiera pedido.
          #
          #   Ejecución manual -> lo decide el input del formulario.
          #   Cron             -> lo decide la variable de repositorio
          #                       CED_CRON_ESCRIBE (Settings -> Variables).
          #                       Si no existe, el cron NO escribe: valida.
          case "${GITHUB_EVENT_NAME}" in
            workflow_dispatch) SOLICITADO="${CED_INPUT_ESCRIBIR:-false}" ;;
            *)                 SOLICITADO="${CED_CRON_ESCRIBE:-false}" ;;
          esac

          WITH_DB=false
          if [ "${SOLICITADO}" = "true" ]; then
            if [ -z "${SUPABASE_HOST}" ] || [ -z "${SUPABASE_USER}" ] || [ -z "${SUPABASE_PASS}" ]; then
              echo "::error::Se ha pedido escribir en producción, pero faltan credenciales de base de datos. No se ejecuta para no dejar la carga a medias."
              exit 1
            fi
            WITH_DB=true
          fi
          echo "Evento: ${GITHUB_EVENT_NAME} · carga a producción: ${WITH_DB}"
          Rscript "Dependencia/00_maestro.R" --steps=extraccion,transformacion,modelado,carga --with-db="${WITH_DB}"

      - name: Upload outputs
        uses: actions/upload-artifact@v4
        with:
          name: dependencia-outputs
          path: |
            Dependencia/2_transformacion/dashboard_indicators.rds
            Dependencia/3_modelado/dashboard_indicators.rds
            Dependencia/3_modelado/seleccion_algoritmo_proyeccion_global.csv
            Dependencia/3_modelado/seleccion_algoritmo_proyeccion_variables.csv
            Dependencia/4_carga/ced_dependencia_global.csv
            Dependencia/4_carga/ced_dependencia_gen.csv
            Dependencia/4_carga/ced_dependencia.xlsx
